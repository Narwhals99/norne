}
/* Fate zones: an attack can only target someone standing in the attacker's zone */
function fillTargets(want){
  const L=$('#rTgtL'),N=$('#rTgtNote'),go=$('[data-a="doRoll"]');if(!L)return;
  const atk=$('#rAct').value==='Attack';
  L.hidden=true;N.hidden=!atk;if(go)go.disabled=false;
  if(!atk)return;
  const key=$('#rWho').value, me=S.combat.tokens.find(t=>tokKey(t)===key), z=me&&zoneOf(me);
  const name=key==='other'?'Someone off the board':(S._roll.rs.find(r=>r.key===key)?.name||'').replace(/ \([^)]*\)$/,'');
  const ts=z?sameZone(me):[];
  if(!me)N.textContent=`${name} isn’t on the combat board, so there’s no one in their zone to attack.`;
  else if(me.out)N.textContent=`${name} has been taken out and can’t attack.`;
  else if(!z)N.textContent=`${name} isn’t in a zone yet. Place them in a zone first.`;
  else if(!ts.length)N.textContent=`No one else is in ${z.name}. Only combatants in the same zone can attack each other.`;
  if(!me||me.out||!z||!ts.length){if(go)go.disabled=true;return}
  $('#rTgt').innerHTML=ts.map(t=>`<option value="${t.id}" ${t.id===want?'selected':''}>${esc(tokName(t))}</option>`).join('');
  L.hidden=false;N.textContent=`Only combatants in ${z.name} can be attacked.`;
}
function fillSkills(){
  const key=$('#rWho').value, r=S._roll.rs.find(x=>x.key===key);
  $('#rOtherL').hidden=key!=='other';
  const sk=Object.entries(r.skills).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  $('#rSkill').innerHTML=sk.map(([n,v])=>`<option value="${esc(n)}|${v}">${esc(n)} (${sgn(v)})</option>`).join('')+'<option value="Unlisted skill|0">Unlisted skill (+0)</option><option value="custom">Custom bonus…</option>';
  if(key==='other') $('#rSkill').value='custom';
  $('#rCustL').hidden=$('#rSkill').value!=='custom';
}
function doRoll(){
  const key=$('#rWho').value, r=S._roll.rs.find(x=>x.key===key);
  let skill,bonus;
  if($('#rSkill').value==='custom'){skill='Bonus';bonus=clamp(parseInt($('#rCust').value,10)||0,-4,10)}
  else{const [n,v]=$('#rSkill').value.split('|');skill=n;bonus=+v}
  const who=key==='other'?($('#rOther').value.trim()||'Someone'):r.name.replace(/ \([^)]*\)$/,'');
  const opp=$('#rOpp').value===''?null:+$('#rOpp').value;
  const secret=!!$('#rSecret')?.checked;
  let target=null;
  if($('#rAct').value==='Attack'){
    const me=S.combat.tokens.find(t=>tokKey(t)===key), tg=S.combat.tokens.find(t=>t.id===$('#rTgt')?.value);
    if(!me||!tg||!zoneOf(me)||tg.zone!==me.zone||tg.out)return toast('Only combatants in the same zone can attack each other.');
    target=tokName(tg);
  }
  const roll={who,whoKey:key,skill,bonus,action:$('#rAct').value,target,opp,dice:[0,0,0,0].map(()=>Math.floor(Math.random()*3)-1),invokes:[]};
  const ch=secret?'gm':(S._roll.from==='combat'||S.tab!=='table'?'table':S.ch);
  const m={id:uid('m'),ch,kind:'roll',by:S.role,as:'',t:Date.now(),text:'',roll};
  S.msgs.push(m);S.fresh=m.id;closeModal();render();
  const tot=rollTotal(roll);toast(`${who} rolled ${sgn(tot)} (${ladderWord(tot)})${secret?' in secret':''}`);
}
function invokeOptions(r){
  const list=[], pc=r.whoKey.startsWith('pc:')?S.chars[r.whoKey.slice(3)]:null;
  if(pc){[pc.hc,pc.trouble,...pc.aspects].filter(Boolean).forEach(a=>list.push({aspect:a,src:pc.short,how:'fp'}))}
  else if(r.whoKey.startsWith('tok:')){const t=S.combat.tokens.find(t=>'tok:'+t.id===r.whoKey);(t?.aspects||[]).forEach(a=>list.push({aspect:a,src:t.name,how:'gm'}))}
  S.combat.scene.forEach((s,i)=>list.push({aspect:s.t,src:'Scene',how:s.free>0?'free':(pc?'fp':'gm'),scene:i}));
  S.combat.zones.filter(z=>z.aspect).forEach(z=>list.push({aspect:z.aspect,src:z.name,how:pc?'fp':'gm'}));
  return {list,pc};
}
function openInvoke(id){
  const m=S.msgs.find(x=>x.id===id);if(!m)return;
  const {list,pc}=invokeOptions(m.roll);S._inv={id,list};
  modal(`<h2>Invoke an aspect</h2>
    <p class="muted">Each invoke adds +2. ${pc?`${esc(pc.short)} has ${pc.fp} fate point${pc.fp===1?'':'s'}.`:'The GM pays from their own pool.'}</p>
    ${list.length?'':'<p class="fine">No aspects to invoke yet. Add scene or zone aspects in Combat.</p>'}
    <ul class="inv-pick">${list.map((o,i)=>{const dis=o.how==='fp'&&pc.fp<1;return `<li><button type="button" data-a="doInvoke" data-i="${i}" ${dis?'disabled':''}><span><span class="aspchip">${esc(o.aspect)}</span><br><span class="fine">${esc(o.src)}</span></span><span class="fine">${o.how==='free'?'Free invoke':o.how==='fp'?'1 fate point':'GM fate point'}</span></button></li>`}).join('')}</ul>
    <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button></div>`);
}
function doInvoke(i){
  const {id,list}=S._inv, o=list[i], m=S.msgs.find(x=>x.id===id);if(!m||!o)return;
  const r=m.roll, pc=r.whoKey.startsWith('pc:')?S.chars[r.whoKey.slice(3)]:null;
  if(o.how==='free'){S.combat.scene[o.scene].free--}
  else if(o.how==='fp'){if(!pc||pc.fp<1)return toast('No fate points left.');pc.fp--}
  r.invokes.push({aspect:o.aspect,how:o.how});
  closeModal();render();toast(`+2 from “${o.aspect}”. New total ${sgn(rollTotal(r))}.`);
}

const ZCOL=['#E0B04A','#5FB3A1','#E07A5F','#8C9BE0','#B98ACB','#9CC36B'];
const tokName=t=>t.kind==='pc'?S.chars[t.ref].short:`${t.name} ${t.label}`;
const tokColor=t=>t.kind==='pc'?S.chars[t.ref].token:t.type==='supporting'?'#6E2A1C':'#A33A2A';
const notice=t=>(t.kind==='pc'?S.chars[t.ref].skills.Notice:t.skills.Notice)||0;
function order(){return S.combat.tokens.filter(t=>!t.out).map((t,i)=>({t,i})).sort((a,b)=>notice(b.t)-notice(a.t)||a.i-b.i).map(x=>x.t)}
function curTurn(){const o=order();return o.length?o[S.combat.turn%o.length]:null}

const tokKey=t=>t.kind==='pc'?'pc:'+t.ref:'tok:'+t.id;
const zoneOf=t=>S.combat.zones.find(z=>z.id===t.zone);
const sameZone=t=>S.combat.tokens.filter(o=>o!==t&&!o.out&&zoneOf(t)&&o.zone===t.zone);
function tokHtml(t,cur){
  const pc=t.kind==='pc', lab=pc?S.chars[t.ref].short[0]:t.label;

function zonesHtml(){
  const c=S.combat, gm=S.role==='gm', cur=curTurn();

function bindMap(view){
  const ptrs=new Map();let pan=null,pinch=null;
  const local=e=>{const r=view.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  view.addEventListener('pointerdown',e=>{
    if(e.target.closest('#pinpop,.mapctl'))return;
    if(e.button!==undefined&&e.button>0)return;
    view.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size===1){const pinEl=e.target.closest('[data-pin]');pan={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,pin:pinEl?.dataset.pin||null}}
    else{if(pan)pan.moved=true;pinch=null}
  });
  view.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    const m=curMap(), v=S.mapViews[m.id];if(!v)return;
    if(ptrs.size===2){
      const [a,b]=[...ptrs.values()], r=view.getBoundingClientRect();
      const d=Math.hypot(a[0]-b[0],a[1]-b[1]), mx=(a[0]+b[0])/2-r.left, my=(a[1]+b[1])/2-r.top;
      if(pinch){zoomAt(d/pinch.d,mx,my);v.x+=mx-pinch.mx;v.y+=my-pinch.my;applyT()}
      pinch={d,mx,my};closePop();return;
    }
    if(!pan)return;
    const dx=e.clientX-pan.lx, dy=e.clientY-pan.ly;pan.lx=e.clientX;pan.ly=e.clientY;
    if(!pan.moved&&Math.hypot(e.clientX-pan.sx,e.clientY-pan.sy)>5)pan.moved=true;
    if(!pan.moved)return;
    if(pan.pin&&S.role==='gm'&&S.mapEdit){const p=pinById(pan.pin);if(!p)return;p.x+=dx/v.k;p.y+=dy/v.k;const el=view.querySelector(`[data-pin="${p.id}"]`);if(el){el.style.left=p.x+'px';el.style.top=p.y+'px'}$('#pinpop').hidden=true}
    else{v.x+=dx;v.y+=dy;applyT();$('#pinpop').hidden=true}
  });
  const up=e=>{
    ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size>0){const [q]=[...ptrs.values()];if(pan&&q){pan.lx=q[0];pan.ly=q[1];pan.pin=null}return}
    const p=pan;pan=null;if(!p||e.type==='pointercancel')return;
    if(p.moved){if(p.pin&&S.role==='gm'&&pinById(p.pin)?.type==='party'){const q=pinById(p.pin);toast('Party marker moved.');void q}return}
    if(p.pin){openPop(p.pin);return}
    if(S.addPin&&S.role==='gm'){
      const m=curMap(), v=S.mapViews[m.id], [lx,ly]=local(e);
      const np={id:uid('p'),type:'note',label:'New pin',note:'',vis:false,x:(lx-v.x)/v.k,y:(ly-v.y)/v.k};
      m.pins.push(np);setAddPin(false);renderPins();openPop(np.id);setTimeout(()=>$('#ppLabel')?.select(),30);return;
    }
    closePop();
  };
  view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
  view.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=local(e);cancelAnimationFrame(zAnim);const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;zoomAt(Math.exp(-clamp(dy,-120,120)*(e.ctrlKey?.01:.0018)),x,y);$('#pinpop').hidden=true},{passive:false});
}

  const issues=[...N.issues].sort((a,b)=>b.no-a.no);
  if(!issues.length) return `<div class="view"><div class="news">
    ${gm?`<div class="news-top"><span class="fine">Players see an edition here once you publish it.</span><button type="button" class="btn primary" data-a="newIssue" style="margin-left:auto">${ICON.pen}Write the first edition</button></div>`:''}
    <article class="paper blank"><h1 class="mast">The News</h1><div class="strip"><span>No. —</span><span>Coming soon</span><span>—</span></div><div class="soon-paper"><div class="orn">${ORN}</div><span>No editions yet. Coming soon.</span><div class="orn">${ORN}</div></div></article>
  </div></div>`;
  const cur=issues.find(i=>i.id===N.reading)||issues[0];
  if(!gm) issues.forEach(i=>N.seen[S.role].add(i.id));
  return `<div class="view"><div class="news">
    <div class="news-top"><div class="eds" role="group" aria-label="Editions">${issues.map(i=>`<button type="button" class="chip" data-a="readIssue" data-v="${i.id}" aria-pressed="${i===cur}">No. ${esc(i.no)} · ${esc(i.date)}</button>`).join('')}</div>
    ${gm?`<button type="button" class="btn primary" data-a="newIssue" style="margin-left:auto">${ICON.pen}Write a new edition</button>`:''}</div>
    ${rPaper(cur)}
  </div></div>`;
}

/* ======================= WIKI ======================= */
const wikiSee=e=>!!e&&(S.role==='gm'||!e.gm);
function links(s){
  return esc(s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,t,lab)=>{const e=S.wiki.find(x=>esc(x.title).toLowerCase()===t.toLowerCase());lab=lab||t;return wikiSee(e)?`<a class="wl" data-a="wsel" data-v="${e.id}">${lab}</a>`:e?lab:`<span class="missing" title="No entry yet">${lab}</span>`});
}
/* a paragraph whose lines all start with "- " is a bulleted list */
function block(p,cls='b'){
  const ls=p.split('\n');
  if(ls.length&&ls.every(l=>l.startsWith('- ')))return `<ul class="bl">${ls.map(l=>`<li>${links(l.slice(2))}</li>`).join('')}</ul>`;
  if(cls&&p.length<60&&p.endsWith(':')&&!p.includes('\n'))return `<h3 class="wsub">${links(p.slice(0,-1))}</h3>`;
  return `<p class="${cls}">${links(p)}</p>`;
}
function wikiListHtml(){
  const q=S.wikiQ.trim().toLowerCase();
  const hit=e=>wikiSee(e)&&(!q||[e.title,e.summary,...e.body].join(' ').toLowerCase().includes(q));
  const cur=S.wiki.find(e=>e.id===S.wikiSel);
  const groups=WCATS.map(c=>[c,S.wiki.filter(e=>e.cat===c&&hit(e))]).filter(g=>g[1].length);
  return groups.length?groups.map(([c,es])=>`<details class="wcat" ${q||cur?.cat===c?'open':''}><summary>${(CICON[c]||"").replace("<svg ",'<svg class="ci" ')}<span class="cl">${esc(c)}</span><span class="n">${es.length}</span></summary><ul>${es.map(e=>`<li><button type="button" data-a="wsel" data-v="${e.id}" aria-current="${e.id===S.wikiSel}">${esc(e.title)}${e.gm?'<span class="tag">GM</span>':''}</button></li>`).join('')}</ul></details>`).join(''):'<p class="fine">No entries match.</p>';
}
/* the first plain paragraph opens with an illuminated initial, lapis or vermilion ground */
function ledeBody(e){return e.body.map((p,i)=>{const h=block(p);return i===0&&h.startsWith('<p class="b">')?h.replace('<p class="b">',`<p class="b lede${e.title.length%2?' alt':''}">`):h}).join('')}
function rArticle(e){
  const gm=S.role==='gm';
  if(!e||!wikiSee(e)) return `<div class="quiet side wpick"><div class="lant">${LANT}</div><p>Pick an entry from the list.</p></div>`;
  const needle='[['+e.title.toLowerCase()+']]';
  const backs=S.wiki.filter(x=>x.id!==e.id&&wikiSee(x)&&[x.summary,...x.body,...x.info.map(i=>i[1]),gm?x.secret||'':''].join(' ').toLowerCase().includes(needle));
  return `<div class="article">
    <div class="art-tools"><button type="button" class="btn sm ghost only-phone" data-a="wbrowse">${ICON.back}All entries</button>${gm?`<button type="button" class="btn sm" data-a="wedit" style="margin-left:auto">${ICON.pen}Edit</button>`:''}</div>
    <div class="eyebrow">${esc(e.cat)}${e.gm?' · GM only':''}</div>
    <h1>${esc(e.title)}</h1>
    <p class="wsum">${links(e.summary)}</p>
    <div class="orn">${ORN}</div>
    ${e.img?`<figure class="wfig"><img src="${esc(e.img.src)}" alt="${esc(e.img.alt)}" loading="lazy"><figcaption>${esc(e.img.cap)}</figcaption></figure>`:''}
    ${e.info.length?`<aside class="infobox"><table>${e.info.map(([k,v])=>`<tr><th scope="row">${esc(k)}</th><td>${links(v)}</td></tr>`).join('')}</table></aside>`:''}
    ${ledeBody(e)}
    ${e.soon?'<p class="soon">More coming soon</p>':''}
    ${gm&&e.secret?`<div class="secret"><div class="eyebrow">GM only · players never see this</div>${e.secret.split(/\n\s*\n/).map(p=>block(p,'')).join('')}</div>`:''}
    ${backs.length?`<div class="backs"><span class="eyebrow">Linked from</span> ${backs.map(b=>`<a class="wl" data-a="wsel" data-v="${b.id}">${esc(b.title)}</a>`).join(', ')}</div>`:''}
    ${e.src?`<p class="sample-note">From the lore notes: ${esc(e.src)}</p>`:''}
  </div>`;
}
function wikiForm(e){
  return `<div class="article"><h1 style="font-size:1.5rem">${e.id?'Edit entry':'New entry'}</h1>
    <form class="form" id="wikiForm">
      <div class="two"><label>Title<input class="inp" id="wfTitle" value="${esc(e.title)}"></label><label>Category<select class="inp" id="wfCat">${WCATS.map(c=>`<option ${c===e.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
      <label>Summary<input class="inp" id="wfSum" value="${esc(e.summary)}"></label>
      <label>Facts box, one per line as “Label: value”<textarea class="inp" id="wfInfo" rows="4">${esc(e.info.map(i=>i.join(': ')).join('\n'))}</textarea></label>
      <label>Article. Blank line between paragraphs. Link entries with [[Title]].<textarea class="inp" id="wfBody" rows="8">${esc(e.body.join('\n\n'))}</textarea></label>
      <label>GM-only secrets<textarea class="inp" id="wfSecret" rows="3">${esc(e.secret||'')}</textarea></label>
      <label class="chk"><input type="checkbox" id="wfGm" ${e.gm?'checked':''}> Hide the whole entry from players</label>
      <div class="row"><button type="button" class="btn primary" data-a="wsave">Save</button><button type="button" class="btn ghost" data-a="wcancel">Cancel</button></div>
    </form></div>`;
}
function vWiki(){
  const gm=S.role==='gm';let e=S.wiki.find(x=>x.id===S.wikiSel);
  if(e&&!wikiSee(e)){e=null;S.wikiSel=null}
  return `<div class="view wikiv"><div class="wiki${S.wikiList?' list':''}">
    <aside class="wside">
      <div class="wfind"><div class="search">${ICON.search}<input class="inp" id="wikiQ" data-i="wikiQ" value="${esc(S.wikiQ)}" placeholder="Search the wiki" aria-label="Search the wiki"></div>
      ${gm?`<button type="button" class="btn sm primary spark" data-a="wnew">${ICON.plus}New entry</button>`:''}</div>

/* ======================= PARTY ======================= */
function rSheet(id){

      <div class="fpbox"><span class="eyebrow">Fate points</span>${pips(ch)}</div></div>
    ${gm?`<div class="row sh-gm">${ch.built?`<button type="button" class="btn sm" data-a="pcEdit" data-who="${id}">${ICON.pen}Edit card</button><button type="button" class="btn sm danger" data-a="pcDel" data-who="${id}">Delete card</button>`:`<button type="button" class="btn sm primary" data-a="pcEdit" data-who="${id}">${ICON.pen}Make ${esc(personName(ch.player))}’s card</button>`}</div>`:''}
    ${ch.built?'':`<div class="sheet-soon"><b>Not made yet.</b> ${gm?`Press “Make ${esc(personName(ch.player))}’s card” to fill in their character.`:mine?'Your GM will make your character card here.':'The GM hasn’t made this card yet.'}</div>`}
    <div class="sec"><h3>Aspects</h3><dl class="asp"><dt>Concept</dt><dd>${esc(ch.hc)||none('Not set yet')}</dd><dt>Trouble</dt><dd>${esc(ch.trouble)||none('Not set yet')}</dd>${ch.aspects.map(a=>`<dt></dt><dd>${esc(a)}</dd>`).join('')}</dl></div>
    <div class="sec"><h3>Skills</h3>${lad.length?`<div class="ladder">${lad.map(([v,ns])=>`<span class="lv">${ladderWord(v)} ${sgn(v)}</span><span class="sks">${ns.map(n=>`<span>${esc(n)}</span>`).join('')}</span>`).join('')}</div>`:`<p class="fine">Not chosen yet. A new character picks one Great (+4), two Good (+3), three Fair (+2) and four Average (+1) skills. See <a class="wl" data-a="wsel" data-v="r-skills">Skills</a> in the wiki.</p>`}</div>
    <div class="sec"><h3>Stunts</h3>${ch.stunts.length?`<ul class="stunts">${ch.stunts.map(([n,d])=>`<li><b>${esc(n)}.</b> ${esc(d)}</li>`).join('')}</ul>`:'<p class="fine">None yet.</p>'}</div>
    <div class="sec stressgrid"><div>${stressRow('pc:'+id,'phys','Physical',ch.stress.phys,ch.stressV.phys)}</div><div>${stressRow('pc:'+id,'ment','Mental',ch.stress.ment,ch.stressV.ment)}</div></div>
    <div class="sec"><h3>Consequences</h3><div class="cons">${[['mild','Mild (2)'],['moderate','Moderate (4)'],['severe','Severe (6)']].map(([k,l])=>`<span class="muted">${l}</span>${gm?`<input class="inp" data-c="cons" data-who="${id}" data-k="${k}" value="${esc(ch.cons[k])}" placeholder="Empty" aria-label="${l} consequence">`:`<span>${esc(ch.cons[k])||'<span class="muted">Empty</span>'}</span>`}`).join('')}</div></div>
    <div class="sec"><h3>Inventory</h3><ul class="inv">${ch.inv.map(([n,q],i)=>`<li><span>${esc(n)}</span><span class="q">×${q}</span>${gm?`<span class="mini"><button type="button" data-a="invQty" data-who="${id}" data-i="${i}" data-d="-1" aria-label="One fewer ${esc(n)}">−</button><button type="button" data-a="invQty" data-who="${id}" data-i="${i}" data-d="1" aria-label="One more ${esc(n)}">+</button><button type="button" data-a="invDel" data-who="${id}" data-i="${i}" aria-label="Remove ${esc(n)}">×</button></span>`:''}</li>`).join('')||'<li class="muted">Empty</li>'}</ul>
      ${gm?`<div class="addrow" style="margin-top:8px"><input class="inp" id="inv-${id}" placeholder="Add an item, e.g. Silver dagger" aria-label="Item name"><input class="inp" id="invq-${id}" type="number" min="1" value="1" style="width:4.5em" aria-label="Quantity"><button type="button" class="btn sm" data-a="invAdd" data-who="${id}">Add</button></div><p class="fine" style="margin-top:6px">Changes post a note in that player’s private chat.</p>`:''}</div>

/* the GM fills in a player's card here; every change saves and reaches the player straight away */

    <div class="row end"><button type="button" class="btn primary" data-a="pcDone">Done</button></div>
  </section>`;
}

const VIEWS={table:vTable,me:vMe,map:vMap,news:vNews,wiki:vWiki,party:vParty,npcs:vNpcs};
const AFTER={

  const fa=document.activeElement, fk=fa&&fa.dataset.a&&$('#shelf').contains(fa)?`#shelf [data-a="${fa.dataset.a}"][data-v="${fa.dataset.v||''}"]`:null;
  if(!canSee(S.ch))S.ch='table';
  const same=S._lastTab===S.tab, draft=$('#msgIn')?.value, cbp=$('#cbpane'), cbTop=same&&cbp?cbp.scrollTop:0;
  const ms=$('#msgs'), msTop=same&&ms&&ms.scrollHeight-ms.scrollTop-ms.clientHeight>40?ms.scrollTop:null;
  $('#main').innerHTML=VIEWS[S.tab]();
  if(draft&&$('#msgIn'))$('#msgIn').value=draft;
  const v=$('#main .view');if(v&&keep)v.scrollTop=keep;

function blankNpc(){
  const v=stressVals(0);
  return {id:uid('n'),name:'New NPC',race:'',occ:'',hc:'',trouble:'',aspects:[],skills:{},magic:'',stunts:[],refresh:3,fp:3,
    stressV:{phys:v,ment:v},stress:{phys:v.map(()=>false),ment:v.map(()=>false)},cons:{mild:'',moderate:'',severe:''},bio:'',notes:''};
}
const curNpc=()=>S.npcDb.find(n=>n.id===S.npcSel);
function npcResize(n){
  for(const [tr,sk] of [['phys','Strength'],['ment','Will']]){
    const v=stressVals(n.skills[sk]||0);
    if(v.join()!==n.stressV[tr].join()){n.stressV[tr]=v;n.stress[tr]=v.map(()=>false)}
  }
}
function npcListHtml(){
  const q=S.npcQ.trim().toLowerCase();

    :`<p class="fine">${S.npcDb.length?'No NPCs match.':'No NPCs yet. Press “New NPC” to write the first card.'}</p>`;
}

function npcToToken(n){
  const sk=Object.fromEntries(Object.entries(n.skills).filter(([,v])=>v));
  const ini=(n.name||'NPC').split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();
  const p={name:n.name||'NPC',type:'supporting',skills:sk,aspects:[n.hc,n.trouble,...n.aspects].map(x=>x.trim()).filter(Boolean)};
  const t=npcFrom(p,ini);t.mild=n.cons.mild||'';t.zone=foeZoneDefault()||null;
  const same=S.combat.tokens.filter(x=>x.name===p.name).length;if(same)t.label=ini+(same+1);
  return t;
}

/* keyboard-aware layout: size the app to the visible viewport so the composer rides the keyboard */
(()=>{
  const vv=window.visualViewport, root=document.documentElement, app=()=>$('#app');
  let raf=0, base=window.innerHeight;
  const apply=()=>{raf=0;
    if(!vv)return;
    const h=Math.round(vv.height);
    root.style.setProperty('--vvh',h+'px');
    if(vv.offsetTop||window.scrollY)window.scrollTo(0,0);
    base=Math.max(base,window.innerHeight);
    const kb=base-h>120&&/^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement?.tagName||'');
    const a=app();if(a){const was=a.classList.contains('kb');a.classList.toggle('kb',kb);
      const m=$('#msgs');if(m&&(kb!==was))m.scrollTop=m.scrollHeight;}
  };
  const sched=()=>{if(!raf)raf=requestAnimationFrame(apply)};
  if(vv){vv.addEventListener('resize',sched);vv.addEventListener('scroll',sched)}
  window.addEventListener('orientationchange',()=>{base=0;setTimeout(()=>{base=window.innerHeight;sched()},300)});
  /* Safari's prev/next/done bar shows when other fields are focusable: park them while typing in chat */
  const park=on=>document.querySelectorAll('input,select,textarea,button').forEach(el=>{
    if(el.id==='msgIn'||el.closest('#composer')&&el.type==='submit')return;
    if(on){if(el.tabIndex!==-1&&!el.dataset.ti){el.dataset.ti='1';el.tabIndex=-1}}
    else if(el.dataset.ti){delete el.dataset.ti;el.removeAttribute('tabindex')}});
  document.addEventListener('focusin',e=>{if(e.target.id==='msgIn'){park(true);sched();setTimeout(sched,300)}});
  document.addEventListener('focusout',e=>{if(e.target.id==='msgIn'){park(false);setTimeout(sched,50)}});
})();

function mkNoise(seed){
  let s=(seed>>>0)||1;const rnd=()=>(s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296;
  const base=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[base[i],base[j]]=[base[j],base[i]]}
  const P=new Uint8Array(512);for(let i=0;i<512;i++)P[i]=base[i&255];
  const v=(x,y)=>P[P[x&255]+(y&255)]/255;
  const n=(x,y)=>{const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),w=fy*fy*(3-2*fy);
    const a=v(ix,iy),b=v(ix+1,iy),c=v(ix,iy+1),d=v(ix+1,iy+1);return a+(b-a)*u+(c-a)*w+(a-b-c+d)*u*w};
  n.fbm=(x,y,o=4)=>{let sum=0,amp=.5,f=1,tot=0;for(let i=0;i<o;i++){sum+=amp*n(x*f,y*f);tot+=amp;amp*=.5;f*=2.03}return sum/tot};
  n.rnd=rnd;return n;
}

/* write the units that differ from what the server last had; partial leaves other units alone */
function writeUnits(path,units,partial){
  if(!LOADED.has(path))return;
  const k=KNOWN.get(path), ch={};let n=0;
  for(const [key,v] of Object.entries(units)){const j=JSON.stringify(v,noEl);if(k.units[key]!==j){ch[key]=j;k.units[key]=j;n++}}
  if(!partial)for(const key of Object.keys(k.units))if(!(key in units)){ch[key]=F.deleteField();delete k.units[key];n++}
  if(n)track(F.setDoc(dref(path),ch,{merge:true}));
}
/* listen to a document; apply(units) runs only when it really changed */
function listenDoc(path,apply){
  return new Promise(res=>{
    F.onSnapshot(dref(path),snap=>{
      const units={};for(const [key,j] of Object.entries(snap.data()||{}))if(typeof j==='string')units[key]=j;
      const prev=KNOWN.get(path), same=prev&&Object.keys(prev.units).length===Object.keys(units).length&&Object.entries(units).every(([key,j])=>prev.units[key]===j);
      KNOWN.set(path,{units:{...units}});
      const first=!LOADED.has(path);LOADED.add(path);
      if(first||!same){apply(units);if(!first)changed()}
      res();
    },err=>{fail(err);res()});
  });
}

function syncMsgs(){
  if(!LOADED.has('msgs'))return;
  for(const m of S.msgs){
    const j=JSON.stringify(m);if(MKNOWN.get(m.id)===j)continue;
    if(!isGM()&&m.ch==='gm')continue;
    MKNOWN.set(m.id,j);const {roll,...rest}=m;
    track(F.setDoc(dref('msgs/'+m.id),{...rest,aud:audOf(m.ch),roll:roll?JSON.stringify(roll):null},{merge:true}));

function applyMsgDocs(){
  const local=new Map(S.msgs.map(m=>[m.id,m]));
  for(const [id,d] of MDOCS){
    const {aud,roll,...m}=d;if(roll)m.roll=JSON.parse(roll);
    const j=JSON.stringify(m), old=local.get(id);
    if(old&&JSON.stringify(old)===j)continue;
    local.set(id,m);MKNOWN.set(id,j);
  }
  S.msgs=[...local.values()].sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1));

function listenMsgs(){
  const qs=isGM()?[F.collection(db,'msgs')]:[F.query(F.collection(db,'msgs'),F.where('aud','array-contains','*')),F.query(F.collection(db,'msgs'),F.where('aud','array-contains',S.role))];
  let waiting=qs.length;
  return new Promise(res=>qs.forEach(q=>F.onSnapshot(q,snap=>{
    let any=false;
    snap.docChanges().forEach(c=>{any=true;if(c.type==='removed')MDOCS.delete(c.doc.id);else MDOCS.set(c.doc.id,c.doc.data())});
    if(any)applyMsgDocs();
    if(waiting>0&&--waiting===0){LOADED.add('msgs');res()}else if(any)changed();
  },err=>{fail(err);res()})));
}

function mapSrc(m){
  if(!m.src?.startsWith('fs:'))return Promise.resolve(m.src);
  const id=m.src.slice(3);
  if(!MIMG.has(id))MIMG.set(id,F.getDoc(dref('mapimgs/'+id)).then(s=>{const d=s.data()?.data;if(!d)throw new Error('no image');return d}).catch(e=>{MIMG.delete(id);throw e}));
  return MIMG.get(id);
}
/* a Firestore document holds at most 1 MB, so uploads are scaled down to fit */
function shrinkImage(img){
  let w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,2400/Math.max(w,h)),q=.85,out='';
  for(let i=0;i<12;i++){
    const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);
    if(out.length<900000)break;
    if(q>.6)q-=.1;else k*=.8;
  }
  return out;
}
function storeMapImage(id,data){MIMG.set(id,Promise.resolve(data));MVIS.set(id,false);track(F.setDoc(dref('mapimgs/'+id),{data,vis:false}))}

/* ---------- what each person writes ---------- */
function syncNow(){
  clearTimeout(_sq);if(!started)return;
  saveLocal();
  if(isGM()){
    writeUnits('game/chars',S.chars);
    const setup=S.combat.state==='setup';
    writeUnits('gm/combat',{c:setup?S.combat:null});
    writeUnits('game/combat',{c:setup?freshCombat(S.combat.bg):S.combat});
    if(LOADED.has('gm/maps')){
      for(const m of S.maps){if(!m.src?.startsWith('fs:'))continue;const id=m.src.slice(3),v=m.vis!==false;if(MVIS.get(id)!==v){MVIS.set(id,v);track(F.setDoc(dref('mapimgs/'+id),{vis:v},{merge:true}))}}
      writeUnits('gm/maps',asUnits(S.maps));
      writeUnits('game/maps',asUnits(S.maps,(m,i)=>m.vis===false?null:{...m,pins:m.pins.filter(p=>p.vis),o:i}));
    }
    if(LOADED.has('gm/wiki')){
      writeUnits('gm/wiki',asUnits(S.wiki));
      writeUnits('game/wiki',asUnits(S.wiki,(e,i)=>{if(e.gm)return null;const {secret,...pub}=e;return {...pub,o:i}}));
    }
    writeUnits('gm/npcs',asUnits(S.npcDb));
    writeUnits('gm/misc',{npcs:S.npcs,foes:FOES});
    writeUnits('game/news',Object.fromEntries(S.news.issues.map(i=>[i.id,i])));
  }else{
    const mine=ROLES[S.role]?.char;
    if(mine&&S.chars[mine])writeUnits('game/chars',{[mine]:S.chars[mine]},true);
    if(S.combat.state==='live')writeUnits('game/combat',{c:S.combat});
  }
  syncMsgs();
}
let _sq=0;
const queueSync=()=>{clearTimeout(_sq);_sq=setTimeout(syncNow,250)};

/* ---------- applying what arrives ---------- */
let GC=null,SC=null;
function setCombat(){S.combat=isGM()&&SC?.state==='setup'?SC:GC||freshCombat(S.combat.bg)}
function setMaps(u){
  const old=new Map(S.maps.map(m=>[m.id,m]));
  S.maps=vals(u).sort(byO);
  for(const m of S.maps){const o=old.get(m.id);if(o?.imgEl&&o.src===m.src)m.imgEl=o.imgEl}
}
/* a change from someone else redraws the page, but never under someone who is typing in a form */
let _rq=0,_late=false;
const typing=()=>{const a=document.activeElement;return !!a&&a.id!=='msgIn'&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#main').contains(a)};
function changed(){if(!live)return;clearTimeout(_rq);_rq=setTimeout(()=>{if(!$('#gate')&&typing()){_late=true;return}_late=false;if(readyCheck())render()},40)}
document.addEventListener('focusout',()=>{if(_late)setTimeout(()=>{if(_late&&!typing())changed()},0)});

function applyMembers(list){
  MEMBERS=list;
  for(const k of Object.keys(ROLES))if(k!=='gm')delete ROLES[k];
  const act=list.filter(m=>isSeat(m.role)).sort((a,b)=>a.role.slice(1)-b.role.slice(1));
  for(const m of act){const n=(m.name||'Player').trim()||'Player';ROLES[m.role]={person:n,char:'pc'+m.role.slice(1),long:n,short:n.split(/\s+/)[0]}}
  CHANNELS.splice(0,CHANNELS.length,{id:'table',who:['gm',...act.map(m=>m.role)]},...act.map(m=>({id:'dm-'+m.role,who:['gm',m.role]})),{id:'gm',who:['gm']});
  ensureChars();
  if($('#modal .mem'))$('#modal').innerHTML=membersHtml();
}
/* every seated player gets a blank Nörne character sheet */
function ensureChars(){
  if(!isGM()||!LOADED.has('game/chars'))return;
  let add=false;
  for(const r of seats()){const id=ROLES[r].char;if(!S.chars[id]){S.chars[id]=blankChar(id,r,TOK[(r.slice(1)-1)%TOK.length]);add=true}}
  if(add)queueSync();
}

/* ---------- this device: unread marks ---------- */
const LKEY=()=>'norne-seen-'+ME.uid;
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LKEY())||'{}');S.seenT[S.role]=d.t||{};S.news.seen[S.role]=new Set(d.n||[])}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY(),JSON.stringify({t:S.seenT[S.role],n:[...S.news.seen[S.role]]}))}catch(e){}}

/* ---------- start-up ---------- */
async function boot(){
  gate('<p class="fine">Opening the campaign book…</p>');
  try{F=await import('./vendor/firebase.js')}catch(e){gate('<p>Norne couldn’t load. Check your connection, then reload the page.</p>');return}
  const app=F.initializeApp(FB);auth=F.getAuth(app);db=F.initializeFirestore(app,{ignoreUndefinedProperties:true});
  if(EMU){F.connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});F.connectFirestoreEmulator(db,'127.0.0.1',8080);
    window.__emu={F,db};
    window.__emuSignIn=(email,name)=>F.signInWithCredential(auth,F.GoogleAuthProvider.credential(JSON.stringify({sub:email,email,name,email_verified:true})))}
  F.onAuthStateChanged(auth,u=>{if(started){location.reload();return}if(u)enter(u).catch(fail);else signInGate()});
}
async function enter(u){
  const email=(u.email||'').toLowerCase(), mref=dref('members/'+u.uid), gm=email===GM_EMAIL;
  gate('<p class="fine">Opening the campaign book…</p>');
  const snap=await F.getDoc(mref);
  if(!snap.exists())await F.setDoc(mref,{name:u.displayName||email.split('@')[0],email,role:gm?'gm':'pending',t:Date.now()});
  else if(gm&&snap.data().role!=='gm')await F.updateDoc(mref,{role:'gm'});
  F.onSnapshot(mref,s=>{
    const d=s.data();if(!d||s.metadata.hasPendingWrites)return;
    ME={uid:u.uid,email,name:d.name,role:d.role};
    if(started){if(d.role!==S.role)location.reload();else renderTop();return}
    if(d.role==='gm'||isSeat(d.role))start(d.role).catch(fail);
    else if(d.role==='removed')gate(`<p>You don’t have a seat at this table any more. Ask the GM if that’s a mistake.</p>${outBtn}`);
    else gate(`<p>Hi ${esc(d.name)}, you’re signed in.</p><p class="fine">The GM still needs to let you in. Ask them to open <b>Players</b> in their menu. This page opens by itself once they do.</p>${outBtn}`);
  },fail);
}
async function start(role){
  started=true;S.role=role;loadLocal();
  const docs=isGM()
    ?[['game/chars',null],['game/combat',null],['gm/combat',null],['gm/maps',null],['gm/wiki',null],['gm/npcs',null],['gm/misc',null],['game/news',null],['game/maps',null],['game/wiki',null]]
    :[['game/chars',null],['game/combat',null],['game/maps',null],['game/wiki',null],['game/news',null]];
  const APPLY={
    'game/chars':u=>{S.chars=Object.fromEntries(Object.entries(u).map(([k,j])=>[k,JSON.parse(j)]));ensureChars()},
    'game/combat':u=>{GC=u.c?JSON.parse(u.c):null;setCombat()},
    'gm/combat':u=>{SC=u.c?JSON.parse(u.c):null;setCombat()},
    'gm/maps':setMaps,
    'gm/wiki':u=>{S.wiki=vals(u).sort(byO)},
    'gm/npcs':u=>{S.npcDb=vals(u)},
    'gm/misc':u=>{S.npcs=u.npcs?JSON.parse(u.npcs):[];FOES.splice(0,FOES.length,...(u.foes?JSON.parse(u.foes):[]))},
    'game/news':u=>{S.news.issues=vals(u)},
    'game/maps':u=>{if(!isGM())setMaps(u)},
    'game/wiki':u=>{if(!isGM())S.wiki=vals(u).sort(byO)},
  };
  const members=new Promise(res=>F.onSnapshot(F.collection(db,'members'),snap=>{applyMembers(snap.docs.map(d=>({uid:d.id,...d.data()})));changed();res()},err=>{fail(err);res()}));
  await members;
  await Promise.all([...docs.map(([p])=>listenDoc(p,APPLY[p])),listenMsgs()]);
  ensureChars();
  for(const t of ['click','change','input','submit','keydown','pointerup'])document.addEventListener(t,queueSync);
  window.addEventListener('pagehide',syncNow);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)syncNow()});
  live=true;if(readyCheck())render();
  if(isGM()&&!S.wiki.length&&!S.maps.length)ACT.lore();
}
/* a new player waits for the GM's device to lay out their character sheet */
function readyCheck(){
  if(isGM()||S.chars[ROLES[S.role]?.char]){gate(null);return true}
  gate(`<p>You’re in. Your character sheet appears as soon as the GM has Norne open.</p>${outBtn}`);return false;
}

/* ---------- actions ---------- */
Object.assign(ACT,{
  signIn(){F.signInWithPopup(auth,new F.GoogleAuthProvider()).catch(e=>{if(!/popup-closed|cancelled-popup/.test(e?.code||''))signInGate(e?.code==='auth/popup-blocked'?'Your browser blocked the sign-in window. Allow pop-ups for this page and try again.':'Sign-in didn’t work. Try again.')})},
  theme(a){setTheme(a.dataset.v);try{localStorage.setItem('norne.theme',a.dataset.v)}catch(e){}},
  signOut(){syncNow();F.signOut(auth).then(()=>location.reload())},
  members(){S.shelf=false;applyShelf();modal(membersHtml())},
  admit(a){const m=MEMBERS.find(x=>x.uid===a.dataset.v);if(!m)return;
    const used=[...MEMBERS.map(x=>+(x.seat||x.role).slice(1)||0),...Object.keys(S.chars).map(k=>+k.slice(2)||0)];
    const seat=m.seat||'p'+(Math.max(0,...used)+1);
    track(F.updateDoc(dref('members/'+m.uid),{role:seat,seat}));toast(`${m.name} is in.`)},
  kick(a){const m=MEMBERS.find(x=>x.uid===a.dataset.v);if(!m)return;
    track(F.updateDoc(dref('members/'+m.uid),{role:'removed'}));toast(isSeat(m.role)?`${m.name} no longer has a seat. Let them back in any time.`:`Turned ${m.name} away.`)},
  lore(){S.shelf=false;applyShelf();modal(`<h2>Import the lore</h2>
    <p class="muted">Choose <b>norne-gm-lore.json</b>. It fills the wiki and the maps, GM secrets included, and saves them for the whole table. Players only ever receive the parts they’re allowed to see.</p>
    <p class="fine">Entries and maps already in Norne with the same name are replaced by the file’s version. Anything you created yourself stays.</p>
    <div class="row end"><button type="button" class="btn ghost" data-a="close">Not now</button><label class="btn primary" for="loreUp">${ICON.upload}Choose the file</label><input type="file" id="loreUp" accept=".json,application/json" hidden data-c="loreUp"></div>`)},
});
function membersHtml(){
  const rank=m=>m.role==='pending'?0:isSeat(m.role)?1:2;
  const L=MEMBERS.filter(m=>m.role!=='gm').sort((a,b)=>rank(a)-rank(b)||(a.t||0)-(b.t||0));
  const st=m=>m.role==='pending'?'Waiting to be let in':m.role==='removed'?'Removed':`Seat ${m.role.slice(1)}`;
  return `<h2>Players</h2>
    <p class="muted">Anyone with the link can sign in with Google, but only people you let in can see the campaign. Each player gets a character sheet and a private chat with you.</p>
    <ul class="mem">${L.map(m=>`<li><div><b>${esc(m.name)}</b><br><span class="fine">${esc(m.email)} · ${st(m)}</span></div>
      ${isSeat(m.role)?`<input class="inp" data-c="memName" data-v="${m.uid}" value="${esc(m.name)}" aria-label="Name the table sees for ${esc(m.name)}"><button type="button" class="btn sm danger" data-a="kick" data-v="${m.uid}">Remove</button>`
        :`<button type="button" class="btn sm primary" data-a="admit" data-v="${m.uid}">Let in</button>${m.role==='pending'?`<button type="button" class="btn sm ghost" data-a="kick" data-v="${m.uid}">Turn away</button>`:''}`}</li>`).join('')
      ||'<li><div>No one else has signed in yet. Send your players the link to this page.</div></li>'}</ul>
    <div class="row end"><button type="button" class="btn ghost" data-a="close">Close</button></div>`;
}
Object.assign(CHANGE,{
  memName(t){const n=t.value.trim();if(n)track(F.updateDoc(dref('members/'+t.dataset.v),{name:n}))},
  loreUp(t){const f=t.files?.[0];if(!f)return;
    f.text().then(txt=>{const d=JSON.parse(txt);if(d.kind!=='norne-lore'||!Array.isArray(d.wiki)||!Array.isArray(d.maps))throw new Error('not lore');return importLore(d)})
      .catch(e=>{console.error(e);toast('That isn’t the Norne lore file.')})},
});
async function importLore(d){
  for(const e of d.wiki){const i=S.wiki.findIndex(x=>x.id===e.id);if(i>=0)S.wiki[i]=e;else S.wiki.push(e)}
  for(const m of d.maps){const i=S.maps.findIndex(x=>x.id===m.id);if(i>=0)S.maps[i]=m;else S.maps.push(m)}
  for(const [id,data] of Object.entries(d.mapimgs||{})){const v=S.maps.find(m=>m.src==='fs:'+id)?.vis!==false;MIMG.set(id,Promise.resolve(data));MVIS.set(id,v);await F.setDoc(dref('mapimgs/'+id),{data,vis:v})}
  closeModal();syncNow();render();toast(`Imported ${d.wiki.length} wiki entries and ${d.maps.length} maps.`);
}

boot();
})();
</script>
