  </aside>
  <div class="shelf-scrim" data-a="shelfClose" aria-hidden="true"></div>
  <div class="stage">
    <div class="demo-note" id="demoNote"><span><b>Welcome.</b> Everything you do here saves and shows up for the rest of the table straight away.</span><button type="button" class="btn sm ghost" data-a="dismissNote">Got it</button></div>
    <main id="main"></main>
  </div>
</div>
<div id="overlay" class="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
'use strict';

/* ---------- small helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');
let _n=0; const uid=p=>p+Date.now().toString(36)+(++_n)+Math.random().toString(36).slice(2,8);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sgn=n=>(n<0?'−':'+')+Math.abs(n);
const hhmm=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const svg=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON={
  table:svg('<path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/>'),
  combat:svg('<path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M14.5 6.5L18 3h3v3l-3.5 3.5"/><path d="M5 14l4 4M7 17l-3 3M3 19l2 2"/>'),
  map:svg('<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>'),
  news:svg('<path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v9a2 2 0 0 1-2 2"/><path d="M7 9h7M7 12h7M7 15h4"/>'),
  wiki:svg('<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"/><path d="M8 7h8M8 10h6"/>'),
  npcs:svg('<path d="M5 4h14v16H5z"/><circle cx="12" cy="10" r="2.6"/><path d="M7.5 18c.6-2.6 2.4-4 4.5-4s3.9 1.4 4.5 4"/>'),
  party:svg('<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/>'),
  whisper:svg('<path d="M4 6h16v10H10l-4 3v-3H4z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/>'),
  lock:svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  download:svg('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  copy:svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'),
  image:svg('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>'),
  upload:svg('<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>'),
  pin:svg('<path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>'),
  back:svg('<path d="M15 6l-6 6 6 6"/>'),
  dice:svg('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12h7M12 8.5v7"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  move:svg('<path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>'),
  zone:svg('<rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="3 3"/>'),
  pen:svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>'),
  grid:svg('<rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/>'),
  quill:svg('<path d="M20 3.5c-7.5.3-12.6 5.4-13.7 13.6 8.1-1 13.3-6.1 13.7-13.6z"/><path d="M4 20l9-9"/><path d="M9.5 14.5h4.2M12 11.2h3.6"/>'),
  search:svg('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.6-4.6"/>'),
  minus:svg('<path d="M5 12h14"/>'),
  fit:svg('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'),
  shelf:svg('<path d="M4 6.5h16M4 12h16M4 17.5h16"/>'),
  close:svg('<path d="M6 6l12 12M18 6L6 18"/>'),
};
const ORN='<svg viewBox="0 0 42 12" aria-hidden="true"><path d="M21 1.2l4.8 4.8-4.8 4.8-4.8-4.8z" fill="currentColor"/><path d="M10.5 6l2.6-2.6 2.6 2.6-2.6 2.6zM26.3 6l2.6-2.6 2.6 2.6-2.6 2.6z" fill="currentColor" opacity=".7"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor" opacity=".55"/><circle cx="37.5" cy="6" r="1.4" fill="currentColor" opacity=".55"/></svg>';

/* ---------- Fate rules ---------- */
/* Nörne ladder (from the Skills notes); results below Poor fall back to Fate's Terrible */
const LADDER={8:'Mythic',7:'Legendary',6:'Renowned',5:'Expert',4:'Great',3:'Good',2:'Fair',1:'Average',0:'Mediocre','-1':'Poor','-2':'Terrible'};
const ladderWord=v=>LADDER[clamp(v,-2,8)];
const MUNDANE=['Athletics','Riding','Stealth','Fighting','Shooting','Strength','Will','Crafting','Crime','Resources','Contact','Search','Empathy','Notice','Deception','Provoke','Rapport','Lore'];
const allSkills=sk=>({...Object.fromEntries(MUNDANE.map(n=>[n,0])),...sk});
/* stress boxes from Strength (physical) or Will (mental), per the Skills notes */
const stressVals=r=>r<=-1?[2]:r===0?[1,2]:r<=2?[1,2,2]:[1,2,2,3];
const ACTIONS=['Overcome','Create an advantage','Attack','Defend'];
const diceSum=r=>r.dice.reduce((a,b)=>a+b,0);
const rollTotal=r=>diceSum(r)+r.bonus+2*r.invokes.length;
function outcome(r){
  if(r.opp==null) return null;
  const sh=rollTotal(r)-r.opp;
  if(sh<0) return {k:'fail',t:'Fail',sh};
  if(sh===0) return {k:'tie',t:'Tie',sh};
  if(sh<3) return {k:'succ',t:'Success',sh};
  return {k:'style',t:'Success with style',sh};
}

/* ---------- people & channels ---------- */
const ROLES={
  gm:{person:'GM',long:'GM',short:'GM'},
};
/* players fill in once people sign in: each admitted player gets a seat p1, p2… and a private chat with the GM */
const CHANNELS=[{id:'table',who:['gm']},{id:'gm',who:['gm']}];
const canSee=(ch,r=S.role)=>CHANNELS.find(c=>c.id===ch).who.includes(r);

/* enemies the GM has built this session, offered again in “Add enemy” */
const FOES=[];

/* ---------- state ---------- */
/* Characters aren't built yet: each player gets an empty sheet that uses Nörne's skill list and stress rules. */
function blankChar(id,player,token){
  const sk={},str=sk.Strength||0,wil=sk.Will||0;
  return {id,name:`${ROLES[player].person}’s character`,short:ROLES[player].person,player,token,built:false,
    hc:'',trouble:'',aspects:[],skills:sk,stunts:[],refresh:3,fp:3,
    stressV:{phys:stressVals(str),ment:stressVals(wil)},stress:{phys:stressVals(str).map(()=>false),ment:stressVals(wil).map(()=>false)},
    cons:{mild:'',moderate:'',severe:''},inv:[]};
}
const S={
  role:'gm', tab:'table', ch:'table', mode:'rp', speakAs:'Narrator', newNpc:false, fresh:null, note:true, folded:new Set(),
  npcs:[],
  npcDb:[], npcSel:null, npcList:true, npcQ:'',
  chars:{
  },
  msgs:[],
  combat:null, sel:null,
  maps:[], mapId:'norne', mapQ:'', mapType:'all', addPin:false, mapEdit:false, pinSel:null, mapViews:{},
  news:null,
  wiki:[], wikiSel:null, wikiQ:'', wikiEdit:null, wikiList:true,
};
S.msgs=[];
/* when each person last looked at each chat, for the unread dots */
S.seenT={};S.shelf=false;

function npcFrom(p,label){const v=stressVals(p.skills.Strength||0);return {id:uid('t'),kind:'npc',name:p.name,label,type:p.type,skills:{...p.skills},aspects:[...p.aspects],stressV:v,stress:v.map(()=>false),mild:'',out:false,zone:null}}
/* Combat is off until the GM begins one from Messages: setup (GM only) → live (everyone can open it beside the chat). */
const freshCombat=bg=>({state:'off',id:null,bg:bg||'forest',turn:0,exchange:1,zones:[],scene:[],tokens:[]});
S.combat=freshCombat();S.cbOpen=false;

/* Maps are the atlases from the lore folder. Pins use fractions of the image size. */
S.maps=[];

S.news={reading:null,editing:false,seen:{},draft:null,issues:[]};

const WCATS=['World','Nations','Places','People','Races','Religions','Magic','Factions','History','Prophecies','Food & Drink','Items','Rules','Storylines'];
/* Wiki entries are transcribed from the lore docs; src names the doc each came from. */
S.wiki=[];

/* ---------- downloads capability (optional) ---------- */
let DL=null;
try{ window.claude?.use?.('downloads')?.then(x=>{DL=x||null}).catch(()=>{}); }catch(e){}

/* ---------- generic UI ---------- */
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{el.hidden=true},2600)}
function modal(html){$('#modal').innerHTML=html;$('#overlay').hidden=false;setTimeout(()=>{($('#modal [autofocus]')||$('#modal button'))?.focus()},20)}
function closeModal(){$('#overlay').hidden=true;$('#modal').innerHTML=''}
function sys(ch,text){S.msgs.push({id:uid('m'),ch,kind:'sys',by:'gm',as:'',t:Date.now(),text})}
const personName=by=>ROLES[by]?.person||'A former player';
const myChar=()=>S.role==='gm'?null:S.chars[ROLES[S.role].char];

/* ---------- top & rail ---------- */
const TABS=[['table','Messages'],['map','Map'],['news','News'],['wiki','Wiki'],['party','Party'],['npcs','NPCs',true]];
function newsUnread(){return S.role!=='gm'&&S.news.issues.some(i=>!S.news.seen[S.role].has(i.id))}
const chIcon=id=>id==='table'?ICON.table:id==='gm'?ICON.lock:ICON.whisper;
const chUnread=id=>canSee(id)&&!(S.tab==='table'&&S.ch===id)&&S.msgs.some(m=>m.ch===id&&m.by!==S.role&&m.t>(S.seenT[S.role][id]||0));
const anyUnread=()=>newsUnread()||CHANNELS.some(c=>chUnread(c.id));
function renderTop(){
  $('#roleSeg').innerHTML=meHtml();
  $('#demoNote').hidden=!S.note;
  const title=TABS.find(t=>t[0]===S.tab)[1];
  const sub=S.tab==='table'?(cbShown()?'Combat':chMeta(S.ch).name):S.tab==='map'?(curMap()?.name||''):'Norne';
  $('#here').innerHTML=`<b>${esc(title)}</b><span>${esc(sub)}</span>`;
  $('#shelfBtn').innerHTML=`${ICON.shelf}<span class="who">${esc(ROLES[S.role].short)}</span>${anyUnread()?'<span class="dot" title="Something new"></span>':''}`;
  $('.shelf-x').innerHTML=ICON.close;
}
function renderRail(){
  const chs=CHANNELS.filter(c=>c.who.includes(S.role));
  $('#rail').innerHTML=TABS.filter(t=>!t[2]||S.role==='gm').map(([id,l,gmOnly])=>`<button type="button" data-a="tab" data-v="${id}" ${S.tab===id?'aria-current="page"':''}>${ICON[id]}<span>${l}</span>${gmOnly?'<span class="tag gmtag">GM</span>':''}${id==='news'&&newsUnread()?'<span class="dot" title="New edition"></span>':''}</button>`
    +(id==='table'?`<div class="sub" role="group" aria-label="Chats">${chs.map(c=>{const nu=chUnread(c.id);return `<button type="button" data-a="chGo" data-v="${c.id}" class="${nu?'new':''}" ${S.tab==='table'&&S.ch===c.id?'aria-current="true"':''} ${nu?'title="New messages"':''}>${chIcon(c.id)}<span>${esc(chMeta(c.id).name)}</span>${nu?'<i class="vh">, new messages</i>':''}</button>`}).join('')}</div>`:'')).join('');
}
/* the shelf slides over the page on phones; on desktop it is always open */
const DESK=matchMedia('(min-width:761px)');
function applyShelf(){
  $('#app').classList.toggle('shelf-open',S.shelf);$('#shelfBtn').setAttribute('aria-expanded',S.shelf);
  $('.top').inert=$('.stage').inert=S.shelf&&!DESK.matches;
}
DESK.addEventListener('change',()=>{if(S.shelf){S.shelf=false;applyShelf()}});
function setShelf(on){
  S.shelf=on;applyShelf();
  if(on)setTimeout(()=>($('#rail [aria-current]')||$('#rail button'))?.focus({preventScroll:true}),60);
  else if(document.activeElement&&$('#shelf').contains(document.activeElement))$('#shelfBtn').focus({preventScroll:true});
}

/* ======================= TABLE (chat) ======================= */
function chMeta(id){
  if(id==='table') return {name:'Everyone',sub:'The GM and all players see this chat.'};
  if(id==='gm') return {name:'GM notes',sub:'Only you see this. Secret rolls land here.'};
  const pr=id.slice(3), ch=S.chars[ROLES[pr]?.char]||{short:personName(pr)};
  if(S.role==='gm') return {name:`${ch.short} · private`,sub:`Only you and ${ROLES[pr].person} (${ch.short}) see this chat.`};
  return {name:'Private with GM',sub:'Only you and the GM see this chat.'};
}
function vTable(){
  const chs=CHANNELS.filter(c=>c.who.includes(S.role));
  if(!chs.some(c=>c.id===S.ch)) S.ch='table';
  S.seenT[S.role][S.ch]=Date.now();
  const cur=chMeta(S.ch), c=S.combat, gm=S.role==='gm', shown=cbShown();
  const cbBtn=gm&&c.state==='off'?`<button type="button" class="btn sm" data-a="cbBegin">${ICON.combat}Begin combat</button>`
    :!shown&&(c.state==='live'||gm&&c.state==='setup')?`<button type="button" class="btn sm primary" data-a="cbOpen">${ICON.combat}${c.state==='setup'?'Combat setup':'Open combat'}</button>`:'';
  return `<div class="view chatv"><div class="chat${shown?' cb-on':''}">
    <section class="chpane">
      <header class="chhead"><div><h2>${esc(cur.name)}</h2><p>${esc(cur.sub)}</p></div><div class="hbtns">${cbBtn}${gm?`<button type="button" class="btn sm" data-a="export">${ICON.download}Export log</button>`:''}</div></header>
      <div class="msgs" id="msgs">${renderMsgs()}</div>
      ${composer()}
    </section>${shown?cbPane():''}</div></div>`;
}
function renderMsgs(){
  const ms=S.msgs.filter(m=>m.ch===S.ch);
  return ms.length?ms.map(rMsg).join(''):`<div class="quiet"><div class="orn">${ORN}</div><p>${S.ch==='table'?'No messages yet. The campaign hasn’t started.':'Nothing here yet.'}</p></div>`;
}
function speakerColor(m){
  if(m.by==='gm') return m.as==='Narrator'?'var(--c-gm)':'var(--c-npc)';
  return `var(--c-${ROLES[m.by]?.char||'npc'})`;
}
function rMsg(m){
  const time=`<time>${hhmm(m.t)}</time>`;
  if(m.kind==='sys') return `<div class="m sys">${esc(m.text)}</div>`;
  if(m.kind==='meta') return `<div class="m meta"><span class="tag">Meta</span><b>${esc(personName(m.by))}</b><span class="mt">${fmt(m.text)}</span>${time}</div>`;
  if(m.kind==='roll') return rRoll(m);
  if(m.kind==='combat'){const live=S.combat.state==='live'&&S.combat.id===m.cid;
    return `<div class="m cbm${live?'':' over'}"><div class="cbm-h">${ICON.combat}<span>${live?'Combat has begun':'Combat'}</span>${time}</div><p>${esc(m.text)}</p>${live?`<button type="button" class="btn sm primary" data-a="cbOpen">${ICON.combat}Open combat</button>`:'<p>This combat has ended.</p>'}</div>`}
  const narr=m.by==='gm'&&m.as==='Narrator';
  return `<div class="m rp${narr?' narr':''}" style="--who:${speakerColor(m)}"><div class="who">${esc(m.as)}${m.by==='gm'&&!narr?'<span class="tag">NPC</span>':''}${time}</div><p>${fmt(m.text)}</p></div>`;
}
function rollerColor(r){return r.whoKey.startsWith('pc:')?`var(--c-${r.whoKey.slice(3)})`:'var(--c-npc)'}
function canInvoke(r){return S.role==='gm'||r.whoKey==='pc:'+ROLES[S.role].char}
function rRoll(m){
  const r=m.roll, tot=rollTotal(r), o=outcome(r);
  const dice=r.dice.map(d=>`<span class="die ${d>0?'p':d<0?'m':'z'}" aria-label="${d>0?'plus':d<0?'minus':'blank'}">${d>0?'+':d<0?'−':''}</span>`).join('');
  const fold=S.folded.has(m.id);
  const head=`<div class="rh"><b style="color:${rollerColor(r)}">${esc(r.who)}</b><span>rolls <b>${esc(r.skill)}</b> ${sgn(r.bonus)}</span>${fold?`<span class="rsum">→ <b>${sgn(tot)}</b> <i>${ladderWord(tot)}</i></span>`:`<span class="act">· ${esc(r.action)}${r.target?` on ${esc(r.target)}`:''}</span>`}${m.ch==='gm'?'<span class="tag">Secret</span>':''}<time>${hhmm(m.t)}</time><button type="button" class="rfold" data-a="fold" data-id="${m.id}" aria-expanded="${!fold}" aria-label="${fold?'Expand':'Collapse'} this roll" title="${fold?'Expand':'Collapse'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button></div>`;
  if(fold) return `<div class="m roll folded${m.ch==='gm'?' secret':''}" data-rid="${m.id}">${head}</div>`;
  return `<div class="m roll${m.ch==='gm'?' secret':''}" data-rid="${m.id}">
    ${head}
    <div class="rb"><div class="dice${S.fresh===m.id?' fresh':''}">${dice}</div><div class="tot"><span class="big">${sgn(tot)}</span><span class="lw">${ladderWord(tot)}</span></div></div>
    <div class="rmath">Dice ${sgn(diceSum(r))} · ${esc(r.skill)} ${sgn(r.bonus)}${r.invokes.length?` · Invokes +${2*r.invokes.length}`:''}</div>
    ${o?`<div class="rout ${o.k}">vs ${ladderWord(r.opp)} (${sgn(r.opp)}): <b>${o.t}</b>${o.sh?` · ${Math.abs(o.sh)} shift${Math.abs(o.sh)===1?'':'s'}`:''}</div>`:''}
    ${r.invokes.map(iv=>`<div class="rinv">Invoked “${esc(iv.aspect)}” for +2 (${iv.how==='free'?'free invoke':iv.how==='fp'?'spent a fate point':'GM fate point'})</div>`).join('')}
    ${canInvoke(r)?`<div><button type="button" class="btn sm" data-a="invoke" data-id="${m.id}">Invoke an aspect (+2)</button></div>`:''}
  </div>`;
}
const speakers=()=>['Narrator',...new Set([...S.npcs,...S.npcDb.map(n=>n.name.trim()).filter(Boolean)])];
function composer(){
  const gm=S.role==='gm', me=myChar();
  const who=S.mode==='rp'
    ?(gm?`<div class="spk"><button type="button" class="inp spk-btn" id="speakAs" data-a="spk" aria-haspopup="listbox" aria-expanded="false" aria-label="Speak as"><span>${esc(S.speakAs)}</span><i aria-hidden="true">▾</i></button><div class="spk-menu" id="spkMenu" role="listbox" hidden>${speakers().map(n=>`<button type="button" role="option" data-a="spkPick" data-v="${esc(n)}" aria-selected="${n===S.speakAs}">${esc(n)}</button>`).join('')}<button type="button" role="option" data-a="spkPick" data-v="__new" class="new">+ New NPC…</button></div></div>`
        :`<span class="as">as <b style="color:var(--c-${me.id})">${esc(me.short)}</b></span>`)
    :`<span class="as">as <b>${esc(personName(S.role))}</b>, out of character</span>`;
  const ph=S.mode==='rp'?(gm?(S.speakAs==='Narrator'?'Describe the scene…':`Speak as ${S.speakAs}…`):`Speak or act as ${me.short}. Use *asterisks* for actions.`):'Questions, rules talk, out-of-character chat…';
  return `<form class="composer ${S.mode}" id="composer">
    <div class="comp-top">
      <div class="seg sm" role="group" aria-label="Message type"><button type="button" data-a="mode" data-v="rp" aria-pressed="${S.mode==='rp'}">Roleplay</button><button type="button" data-a="mode" data-v="meta" aria-pressed="${S.mode==='meta'}">Meta</button></div>
      ${who}
      <button type="button" class="btn sm roll-btn" data-a="roll" data-from="chat">${ICON.dice}Roll</button>
    </div>
    ${S.newNpc?`<div class="comp-new"><input id="newNpc" class="inp" placeholder="NPC name, e.g. Björn Greymaul" aria-label="New NPC name"><button type="button" class="btn sm" data-a="addNpc">Add</button><button type="button" class="btn sm ghost" data-a="cancelNpc">Cancel</button></div>`:''}
    <div class="comp-row"><textarea id="msgIn" rows="1" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" placeholder="${esc(ph)}" aria-label="Message"></textarea><button class="btn primary" type="submit" aria-label="Send">${ICON.quill}<span>Send</span></button></div>
  </form>`;
}
function refreshMsgs(){const el=$('#msgs');if(!el)return;el.innerHTML=renderMsgs();el.scrollTop=el.scrollHeight}
function refreshComposer(focus=true){const old=$('#composer');if(!old)return;const val=$('#msgIn')?.value||'';old.outerHTML=composer();const ta=$('#msgIn');ta.value=val;autoGrow();if(focus&&!S.newNpc)ta.focus();if(S.newNpc)$('#newNpc')?.focus()}
function autoGrow(){const ta=$('#msgIn');if(!ta)return;ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight+2,160)+'px'}
function send(){
  const ta=$('#msgIn');if(!ta)return;const text=ta.value.trim();if(!text)return;
  const as=S.mode==='rp'?(S.role==='gm'?S.speakAs:myChar().name):'';
  S.msgs.push({id:uid('m'),ch:S.ch,kind:S.mode,by:S.role,as,t:Date.now(),text});
  ta.value='';autoGrow();refreshMsgs();
}

/* export */
const exName=id=>id==='table'?'Everyone':id==='gm'?'GM notes (GM only)':`Private: ${personName(id.slice(3))} and GM`;
function rollText(r){
  const tot=rollTotal(r),o=outcome(r);
  return `${r.who}, ${r.skill} ${sgn(r.bonus)} (${r.action}${r.target?` on ${r.target}`:''}). Dice ${r.dice.map(d=>d>0?'+':d<0?'−':'0').join(' ')}${r.invokes.length?`, invoked ${r.invokes.map(i=>'“'+i.aspect+'”').join(', ')} (+${2*r.invokes.length})`:''} → ${sgn(tot)} ${ladderWord(tot)}${o?` vs ${ladderWord(r.opp)} (${sgn(r.opp)}): ${o.t}${o.sh?`, ${Math.abs(o.sh)} shift${Math.abs(o.sh)===1?'':'s'}`:''}`:''}.`;
}
function exLine(m){
  const t=`[${hhmm(m.t)}]`;
  if(m.kind==='sys') return `${t} — ${m.text}`;
  if(m.kind==='meta') return `${t} (meta) ${personName(m.by)}: ${m.text}`;
  if(m.kind==='roll') return `${t} ROLL: ${rollText(m.roll)}`;
  if(m.kind==='combat') return `${t} — Combat begins. ${m.text}`;
  if(m.by==='gm'&&m.as==='Narrator') return `${t} NARRATOR: ${m.text}`;
  return `${t} ${m.as}${m.by==='gm'?' (NPC)':''}: ${m.text}`;
}
function exSel(){return {ch:Object.fromEntries(CHANNELS.map(c=>[c.id,!!$('#ex-'+c.id)?.checked])),rp:$('#ex-rp')?.checked,roll:$('#ex-roll')?.checked,meta:$('#ex-meta')?.checked}}
function buildExport(sel){
  const kinds=[sel.rp&&'roleplay',sel.roll&&'rolls',sel.meta&&'meta chat'].filter(Boolean);
  const out=['# Nörne: session log',`Exported ${new Date().toLocaleString()} · includes ${kinds.join(', ')||'nothing'}`];
  for(const c of CHANNELS){
    if(!sel.ch[c.id]) continue;
    const ms=S.msgs.filter(m=>m.ch===c.id&&((m.kind==='rp'&&sel.rp)||(m.kind==='roll'&&sel.roll)||(m.kind==='meta'&&sel.meta)||(m.kind==='sys'&&sel.rp)));
    if(!ms.length) continue;
    out.push('',`## ${exName(c.id)}`,'',ms.map(exLine).join('\n\n'));
  }
  return out.join('\n');
}
function openExport(){
  modal(`<h2>Export the log</h2>
    <p class="muted">For your notes, or to paste into an AI for a session summary.</p>
    <fieldset><legend>Chats</legend>${CHANNELS.map(c=>`<label class="chk"><input type="checkbox" id="ex-${c.id}" data-c="ex" ${c.id!=='gm'?'checked':''}> ${esc(exName(c.id))}</label>`).join('')}</fieldset>
    <fieldset><legend>Include</legend><label class="chk"><input type="checkbox" id="ex-rp" data-c="ex" checked> Roleplay</label><label class="chk"><input type="checkbox" id="ex-roll" data-c="ex" checked> Rolls</label><label class="chk"><input type="checkbox" id="ex-meta" data-c="ex"> Meta chat</label></fieldset>
    <label class="fl" for="exOut">Preview</label><textarea id="exOut" class="ex-out" readonly></textarea>
    <div class="row end">${DL?`<button type="button" class="btn primary" data-a="exDl">${ICON.download}Download .md</button>`:''}<button type="button" class="btn${DL?'':' primary'}" data-a="exCopy">${ICON.copy}Copy</button><button type="button" class="btn ghost" data-a="close">Close</button></div>`);
  updateExport();
}
function updateExport(){const o=$('#exOut');if(o)o.value=buildExport(exSel())}

/* rolls */
function rollersFor(role){
  if(role!=='gm'){const c=myChar();return [{key:'pc:'+c.id,name:c.name,skills:allSkills(c.skills)}]}
  return [...Object.values(S.chars).map(c=>({key:'pc:'+c.id,name:c.name,skills:allSkills(c.skills)})),
    ...S.combat.tokens.filter(t=>t.kind==='npc').map(t=>({key:'tok:'+t.id,name:`${t.name} (${t.label})`,skills:t.skills})),
    {key:'other',name:'Someone else…',skills:{}}];
}
function openRoll(from,pre){
  const gm=S.role==='gm', rs=rollersFor(S.role);
  let def=rs[0].key;
  if(from==='combat'&&S.sel&&!S.sel.startsWith('zone:')){const t=S.combat.tokens.find(t=>t.id===S.sel);if(t)def=tokKey(t)}
  if(pre?.who&&rs.some(r=>r.key===pre.who))def=pre.who;
  S._roll={from,rs,pre};
  modal(`<h2>Roll the dice</h2>
    <div class="form">
      <label>Who is rolling<select id="rWho" class="inp" data-c="rWho" ${gm?'':'disabled'}>${rs.map(r=>`<option value="${r.key}" ${r.key===def?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>
      <label id="rOtherL" hidden>Name<input id="rOther" class="inp" placeholder="e.g. City watch guard"></label>
      <label>Skill<select id="rSkill" class="inp" data-c="rSkill"></select></label>
      <label id="rCustL" hidden>Bonus<input id="rCust" class="inp" type="number" min="-4" max="10" value="2"></label>
      <div class="two"><label>Action<select id="rAct" class="inp" data-c="rAct">${ACTIONS.map(a=>`<option ${pre?.act===a?'selected':''}>${a}</option>`).join('')}</select></label>
      <label>Against<select id="rOpp" class="inp"><option value="">No set difficulty</option>${[6,5,4,3,2,1,0,-1].map(v=>`<option value="${v}" ${v===2?'selected':''}>${ladderWord(v)} (${sgn(v)})</option>`).join('')}</select></label></div>
      <label id="rTgtL" hidden>Target<select id="rTgt" class="inp"></select></label>
      <p id="rTgtNote" class="fine" hidden></p>
      ${gm?'<label class="chk"><input type="checkbox" id="rSecret"> Secret roll. Only you see it, in GM notes.</label>':''}
    </div>
    <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button type="button" class="btn primary" data-a="doRoll" autofocus>${ICON.dice}Roll 4dF</button></div>`);
  fillSkills();
  if(pre?.skill){const o=[...$('#rSkill').options].find(o=>o.value.startsWith(pre.skill+'|'));if(o)$('#rSkill').value=o.value}
  fillTargets(pre?.target);
}
/* Fate zones: an attack can only target someone standing in the attacker's zone */
function fillTargets(want){
  const L=$('#rTgtL'),N=$('#rTgtNote'),go=$('[data-a="doRoll"]');if(!L)return;
  const atk=$('#rAct').value==='Attack';
  L.hidden=true;N.hidden=!atk;if(go)go.disabled=false;
  if(!atk)return;
  const key=$('#rWho').value, me=S.combat.tokens.find(t=>tokKey(t)===key), z=me&&zoneOf(me);
  const name=key==='other'?'Someone off the board':(S._roll.rs.find(r=>r.key===key)?.name||'').replace(/ \([^)]*\)$/,'');
  const ts=z?sameZone(me):[];
  if(!me)N.textContent=`${name} isn’t on the combat board, so there’s no one in their zone to attack.`;
  else if(me.out)N.textContent=`${name} has been taken out and can’t attack.`;
  else if(!z)N.textContent=`${name} isn’t in a zone yet. Place them in a zone first.`;
  else if(!ts.length)N.textContent=`No one else is in ${z.name}. Only combatants in the same zone can attack each other.`;
  if(!me||me.out||!z||!ts.length){if(go)go.disabled=true;return}
  $('#rTgt').innerHTML=ts.map(t=>`<option value="${t.id}" ${t.id===want?'selected':''}>${esc(tokName(t))}</option>`).join('');
  L.hidden=false;N.textContent=`Only combatants in ${z.name} can be attacked.`;
}
function fillSkills(){
  const key=$('#rWho').value, r=S._roll.rs.find(x=>x.key===key);
  $('#rOtherL').hidden=key!=='other';
  const sk=Object.entries(r.skills).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  $('#rSkill').innerHTML=sk.map(([n,v])=>`<option value="${esc(n)}|${v}">${esc(n)} (${sgn(v)})</option>`).join('')+'<option value="Unlisted skill|0">Unlisted skill (+0)</option><option value="custom">Custom bonus…</option>';
  if(key==='other') $('#rSkill').value='custom';
  $('#rCustL').hidden=$('#rSkill').value!=='custom';
}
function doRoll(){
  const key=$('#rWho').value, r=S._roll.rs.find(x=>x.key===key);
  let skill,bonus;
  if($('#rSkill').value==='custom'){skill='Bonus';bonus=clamp(parseInt($('#rCust').value,10)||0,-4,10)}
  else{const [n,v]=$('#rSkill').value.split('|');skill=n;bonus=+v}
  const who=key==='other'?($('#rOther').value.trim()||'Someone'):r.name.replace(/ \([^)]*\)$/,'');
  const opp=$('#rOpp').value===''?null:+$('#rOpp').value;
  const secret=!!$('#rSecret')?.checked;
  let target=null;
  if($('#rAct').value==='Attack'){
    const me=S.combat.tokens.find(t=>tokKey(t)===key), tg=S.combat.tokens.find(t=>t.id===$('#rTgt')?.value);
    if(!me||!tg||!zoneOf(me)||tg.zone!==me.zone||tg.out)return toast('Only combatants in the same zone can attack each other.');
    target=tokName(tg);
  }
  const roll={who,whoKey:key,skill,bonus,action:$('#rAct').value,target,opp,dice:[0,0,0,0].map(()=>Math.floor(Math.random()*3)-1),invokes:[]};
  const ch=secret?'gm':(S._roll.from==='combat'||S.tab!=='table'?'table':S.ch);
  const m={id:uid('m'),ch,kind:'roll',by:S.role,as:'',t:Date.now(),text:'',roll};
  S.msgs.push(m);S.fresh=m.id;closeModal();render();
  const tot=rollTotal(roll);toast(`${who} rolled ${sgn(tot)} (${ladderWord(tot)})${secret?' in secret':''}`);
}
function invokeOptions(r){
  const list=[], pc=r.whoKey.startsWith('pc:')?S.chars[r.whoKey.slice(3)]:null;
  if(pc){[pc.hc,pc.trouble,...pc.aspects].filter(Boolean).forEach(a=>list.push({aspect:a,src:pc.short,how:'fp'}))}
  else if(r.whoKey.startsWith('tok:')){const t=S.combat.tokens.find(t=>'tok:'+t.id===r.whoKey);(t?.aspects||[]).forEach(a=>list.push({aspect:a,src:t.name,how:'gm'}))}
  S.combat.scene.forEach((s,i)=>list.push({aspect:s.t,src:'Scene',how:s.free>0?'free':(pc?'fp':'gm'),scene:i}));
  S.combat.zones.filter(z=>z.aspect).forEach(z=>list.push({aspect:z.aspect,src:z.name,how:pc?'fp':'gm'}));
  return {list,pc};
}
function openInvoke(id){
  const m=S.msgs.find(x=>x.id===id);if(!m)return;
  const {list,pc}=invokeOptions(m.roll);S._inv={id,list};
  modal(`<h2>Invoke an aspect</h2>
    <p class="muted">Each invoke adds +2. ${pc?`${esc(pc.short)} has ${pc.fp} fate point${pc.fp===1?'':'s'}.`:'The GM pays from their own pool.'}</p>
    ${list.length?'':'<p class="fine">No aspects to invoke yet. Add scene or zone aspects in Combat.</p>'}
    <ul class="inv-pick">${list.map((o,i)=>{const dis=o.how==='fp'&&pc.fp<1;return `<li><button type="button" data-a="doInvoke" data-i="${i}" ${dis?'disabled':''}><span><span class="aspchip">${esc(o.aspect)}</span><br><span class="fine">${esc(o.src)}</span></span><span class="fine">${o.how==='free'?'Free invoke':o.how==='fp'?'1 fate point':'GM fate point'}</span></button></li>`}).join('')}</ul>
    <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button></div>`);
}
function doInvoke(i){
  const {id,list}=S._inv, o=list[i], m=S.msgs.find(x=>x.id===id);if(!m||!o)return;
  const r=m.roll, pc=r.whoKey.startsWith('pc:')?S.chars[r.whoKey.slice(3)]:null;
  if(o.how==='free'){S.combat.scene[o.scene].free--}
  else if(o.how==='fp'){if(!pc||pc.fp<1)return toast('No fate points left.');pc.fp--}
  r.invokes.push({aspect:o.aspect,how:o.how});
  closeModal();render();toast(`+2 from “${o.aspect}”. New total ${sgn(rollTotal(r))}.`);
}

/* ======================= COMBAT ======================= */
const ZCOL=['#E0B04A','#5FB3A1','#E07A5F','#8C9BE0','#B98ACB','#9CC36B'];
const tokName=t=>t.kind==='pc'?S.chars[t.ref].short:`${t.name} ${t.label}`;
const tokColor=t=>t.kind==='pc'?S.chars[t.ref].token:t.type==='supporting'?'#6E2A1C':'#A33A2A';
const notice=t=>(t.kind==='pc'?S.chars[t.ref].skills.Notice:t.skills.Notice)||0;
function order(){return S.combat.tokens.filter(t=>!t.out).map((t,i)=>({t,i})).sort((a,b)=>notice(b.t)-notice(a.t)||a.i-b.i).map(x=>x.t)}
function curTurn(){const o=order();return o.length?o[S.combat.turn%o.length]:null}
const skillsShort=sk=>Object.entries(sk).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`${n} ${sgn(v)}`).join(', ');
const tokKey=t=>t.kind==='pc'?'pc:'+t.ref:'tok:'+t.id;
const zoneOf=t=>S.combat.zones.find(z=>z.id===t.zone);
const sameZone=t=>S.combat.tokens.filter(o=>o!==t&&!o.out&&zoneOf(t)&&o.zone===t.zone);
function tokHtml(t,cur){
  const pc=t.kind==='pc', lab=pc?S.chars[t.ref].short[0]:t.label;
  const cls=['tok',pc?'pc':'npc',t.type==='supporting'?'sup':'',t.out?'out':'',S.sel===t.id?'sel':'',cur===t?'cur':''].filter(Boolean).join(' ');
  return `<div class="${cls}" data-tok="${t.id}" tabindex="0" role="button" aria-label="${esc(tokName(t))}${t.out?', taken out':''}" style="--tc:${tokColor(t)}"><span class="tk">${esc(lab)}</span><span class="nm">${esc(tokName(t))}</span></div>`;
}
function zonesHtml(){
  const c=S.combat, gm=S.role==='gm', cur=curTurn();
  const selT=S.sel&&!S.sel.startsWith('zone:')?c.tokens.find(t=>t.id===S.sel):null;
  const card=(z,ts)=>{
    const cls=['zone',z?'':'none',z&&S.sel==='zone:'+z.id?'sel':'',z&&selT&&selT.zone===z.id?'home':''].filter(Boolean).join(' ');
    return `<section class="${cls}" data-zone="${z?z.id:''}" style="${z?`--zc:${z.color}`:''}" aria-label="${z?esc(z.name):'Not in a zone'}">
      <button type="button" class="zh" ${z?`data-a="selZone" data-v="${z.id}"`:'disabled'}><span class="zn">${z?esc(z.name):'Not in a zone'}<span>${ts.length}</span></span>${z?.aspect?`<i>${esc(z.aspect)}</i>`:''}</button>
      <div class="ztoks">${ts.map(t=>tokHtml(t,cur)).join('')||`<span class="zemp">${gm?'Empty. Drag someone here.':'Empty'}</span>`}</div></section>`;
  };
  const loose=c.tokens.filter(t=>!zoneOf(t));
  return c.zones.map(z=>card(z,c.tokens.filter(t=>t.zone===z.id))).join('')+(loose.length?card(null,loose):'')
    +(gm?`<button type="button" class="zadd" data-a="zoneAdd">${ICON.plus}Add zone</button>`:'')

function bindBoard(){
  const b=$('#board');if(!b)return;const c=S.combat;
  const src=getBg(c.bg), cv=$('#bgc');
  cv.width=src.width;cv.height=src.height;cv.getContext('2d').drawImage(src,0,0);
  const zoneAt=(x,y)=>document.elementFromPoint(x,y)?.closest('#board [data-zone]');
  const clear=()=>{if(!drag)return;drag.ghost?.remove();drag.el.classList.remove('dragging');$$('#board .zone.drop').forEach(z=>z.classList.remove('drop'))};
  b.addEventListener('pointerdown',e=>{
    const tokEl=e.target.closest('[data-tok]');
    if(!tokEl){if(!e.target.closest('.zone,.zadd')&&S.sel){S.sel=null;render()}return}
    const t=c.tokens.find(t=>t.id===tokEl.dataset.tok);if(!t)return;
    if(S.role==='gm'&&e.button===0){drag={t,el:tokEl,sx:e.clientX,sy:e.clientY,moved:false};b.setPointerCapture(e.pointerId)}
    else{S.sel=t.id;render()}
  });

    if(!drag)return;

      if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
      drag.moved=true;drag.ghost=drag.el.cloneNode(true);drag.ghost.classList.add('ghost');drag.ghost.removeAttribute('data-tok');
      document.body.appendChild(drag.ghost);drag.el.classList.add('dragging');
    }

    const z=zoneAt(e.clientX,e.clientY);

  });

    if(!drag)return;const d=drag;

}

    const st=$('#mapstage');if(!st||curMap()!==m)return;

    $('#maploading').hidden=true;
    if(!S.mapViews[m.id])S.mapViews[m.id]=fitView(m);
    applyT();renderPins();
  };
  if(!m.imgEl){
    $('#maploading').hidden=false;
    const img=new Image();img.decoding='async';
    img.onload=()=>{m.imgEl=img;go()};
    img.onerror=()=>{$('#maploading').textContent='This map image didn’t load.'};

  }else go();

}
function pinMatches(p){
  if(p.type==='party') return true;
  if(S.mapType!=='all'&&p.type!==S.mapType) return false;
  const q=S.mapQ.trim().toLowerCase();if(!q) return true;
  const tn=PT[p.type].name.toLowerCase();
  return p.label.toLowerCase().includes(q)||(p.note||'').toLowerCase().includes(q)||tn.includes(q)||q.includes(p.type);
}
function renderPins(){
  const m=curMap(), el=$('#pins');if(!el)return;const gm=S.role==='gm';
  const dot=m.labeled;

}
function popHtml(p){
  const gm=S.role==='gm', party=p.type==='party';
  const wk=p.wiki&&wikiSee(S.wiki.find(e=>e.id===p.wiki))?`<div class="row"><button type="button" class="btn sm" data-a="wsel" data-v="${p.wiki}">${ICON.wiki}Read in the wiki</button></div>`:'';
  if(!gm) return `<div class="pp-h"><span class="eyebrow">${esc(PT[p.type].name)}</span><button type="button" class="x" data-a="pinClose" aria-label="Close">×</button></div><h3>${esc(p.label)}</h3>${p.note?`<p>${esc(p.note)}</p>`:''}${wk}`;
  return `<div class="pp-h"><span class="eyebrow">${party?'Party marker':'Pin'}</span><button type="button" class="x" data-a="pinClose" aria-label="Close">×</button></div>
    <div class="form">
      <label>Name<input class="inp" id="ppLabel" data-i="ppLabel" value="${esc(p.label)}"></label>
      ${party?'<p class="fine">Tap Edit on the map, then drag this marker to move the party, or use “Move party here” on any pin.</p>':`<label>Type<select class="inp" data-c="ppType">${Object.keys(PT).filter(t=>t!=='party').map(t=>`<option value="${t}" ${t===p.type?'selected':''}>${PT[t].name.replace(/s$/,'')}</option>`).join('')}</select></label>
      <label>Notes<textarea class="inp" rows="2" data-i="ppNote">${esc(p.note)}</textarea></label>
      <label class="chk"><input type="checkbox" data-c="ppVis" ${p.vis?'checked':''}> Players can see this</label>`}
    </div>
    ${party?'':`<div class="row"><button type="button" class="btn sm" data-a="pinParty">Move party here</button><button type="button" class="btn sm danger" data-a="pinDel">Delete</button></div>${wk}`}`;
}
function openPop(id){
  const m=curMap(), p=m.pins.find(p=>p.id===id), pop=$('#pinpop'), view=$('#mapview');if(!p||!pop||!view)return;
  S.pinSel=id;renderPins();pop.innerHTML=popHtml(p);pop.hidden=false;
  const v=S.mapViews[m.id], sx=v.x+p.x*v.k, sy=v.y+p.y*v.k, vw=view.clientWidth, vh=view.clientHeight, pw=pop.offsetWidth, ph=pop.offsetHeight;
  let top=sy+16;if(top+ph>vh-8)top=Math.max(8,sy-ph-46);
  pop.style.left=clamp(sx-pw/2,8,Math.max(8,vw-pw-8))+'px';pop.style.top=top+'px';
}
function closePop(){const pop=$('#pinpop');if(pop)pop.hidden=true;if(S.pinSel){S.pinSel=null;renderPins()}}
const pinById=id=>curMap().pins.find(p=>p.id===id);
function setAddPin(on){S.addPin=on;const b=$('#addPinBtn');if(b){b.classList.toggle('primary',on);b.setAttribute('aria-pressed',on);b.innerHTML=ICON.pin+(on?'Tap the map…':'Add pin')}$('#mapview')?.classList.toggle('placing',on)}
function bindMap(view){
  const ptrs=new Map();let pan=null,pinch=null;
  const local=e=>{const r=view.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  view.addEventListener('pointerdown',e=>{
    if(e.target.closest('#pinpop,.mapctl'))return;
    if(e.button!==undefined&&e.button>0)return;
    view.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size===1){const pinEl=e.target.closest('[data-pin]');pan={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,pin:pinEl?.dataset.pin||null}}
    else{if(pan)pan.moved=true;pinch=null}
  });
  view.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    const m=curMap(), v=S.mapViews[m.id];if(!v)return;
    if(ptrs.size===2){
      const [a,b]=[...ptrs.values()], r=view.getBoundingClientRect();
      const d=Math.hypot(a[0]-b[0],a[1]-b[1]), mx=(a[0]+b[0])/2-r.left, my=(a[1]+b[1])/2-r.top;
      if(pinch){zoomAt(d/pinch.d,mx,my);v.x+=mx-pinch.mx;v.y+=my-pinch.my;applyT()}
      pinch={d,mx,my};closePop();return;
    }
    if(!pan)return;
    const dx=e.clientX-pan.lx, dy=e.clientY-pan.ly;pan.lx=e.clientX;pan.ly=e.clientY;
    if(!pan.moved&&Math.hypot(e.clientX-pan.sx,e.clientY-pan.sy)>5)pan.moved=true;
    if(!pan.moved)return;
    if(pan.pin&&S.role==='gm'&&S.mapEdit){const p=pinById(pan.pin);if(!p)return;p.x+=dx/v.k;p.y+=dy/v.k;const el=view.querySelector(`[data-pin="${p.id}"]`);if(el){el.style.left=p.x+'px';el.style.top=p.y+'px'}$('#pinpop').hidden=true}
    else{v.x+=dx;v.y+=dy;applyT();$('#pinpop').hidden=true}
  });
  const up=e=>{
    ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size>0){const [q]=[...ptrs.values()];if(pan&&q){pan.lx=q[0];pan.ly=q[1];pan.pin=null}return}
    const p=pan;pan=null;if(!p||e.type==='pointercancel')return;
    if(p.moved){if(p.pin&&S.role==='gm'&&pinById(p.pin)?.type==='party'){const q=pinById(p.pin);toast('Party marker moved.');void q}return}
    if(p.pin){openPop(p.pin);return}
    if(S.addPin&&S.role==='gm'){
      const m=curMap(), v=S.mapViews[m.id], [lx,ly]=local(e);
      const np={id:uid('p'),type:'note',label:'New pin',note:'',vis:false,x:(lx-v.x)/v.k,y:(ly-v.y)/v.k};
      m.pins.push(np);setAddPin(false);renderPins();openPop(np.id);setTimeout(()=>$('#ppLabel')?.select(),30);return;
    }
    closePop();
  };
  view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
  view.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=local(e);cancelAnimationFrame(zAnim);const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;zoomAt(Math.exp(-clamp(dy,-120,120)*(e.ctrlKey?.01:.0018)),x,y);$('#pinpop').hidden=true},{passive:false});
}

const paras=t=>String(t||'').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).map(s=>`<p>${esc(s)}</p>`).join('');
function rPaper(p,preview){
  const ph=(v,f)=>v?esc(v):(preview?`<span class="ph-empty">${f}</span>`:'');
  const stories=(p.stories||[]).filter(s=>s.title||s.body);
  const notices=(p.notices||[]).filter(Boolean);
  return `<article class="paper">
    <h1 class="mast">${ph(p.paper,'Paper name')}</h1>
    <div class="strip"><span>No. ${ph(String(p.no??''),'—')}</span><span>${ph(p.date,'In-world date')}</span><span>${ph(p.price,'Price')}</span></div>
    <h2 class="headline">${ph(p.headline,'Your headline here')}</h2>
    ${p.sub||preview?`<p class="sub">${ph(p.sub,'A line under the headline')}</p>`:''}
    <div class="lead${String(p.lead||'').length<700?' one':''}">${paras(p.lead)||(preview?'<p class="ph-empty">The lead story goes here. Leave a blank line between paragraphs.</p>':'')}</div>
    ${stories.length?`<div class="stories">${stories.map(s=>`<section><h3>${esc(s.title)}</h3>${paras(s.body)}</section>`).join('')}</div>`:''}
    ${notices.length?`<aside class="notices"><h3>Notices</h3><ul>${notices.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></aside>`:''}
  </article>`;
}
function draftIssue(d){return {paper:d.paper,no:d.no,date:d.date,price:d.price,headline:d.headline,sub:d.sub,lead:d.lead,stories:[{title:d.s1t,body:d.s1b},{title:d.s2t,body:d.s2b}],notices:d.notices.split('\n').map(s=>s.trim()).filter(Boolean)}}

    return `<div class="view"><div class="news">

      <div class="ed">

          ${f('date','In-world date','e.g. Restday, the 3rd of High Shine')}
          ${f('headline','Headline','What everyone is talking about')}
          ${f('sub','Under the headline','One line of detail')}
          ${f('lead','Lead story','Leave a blank line between paragraphs.',true,6)}
          ${f('s1t','Second story: title','Optional')}${f('s1b','Second story: text','',true,3)}
          ${f('s2t','Third story: title','Optional')}${f('s2b','Third story: text','',true,3)}
          ${f('notices','Notices, one per line','Wanted posters, ads, announcements…',true,3)}

    <article class="paper blank"><h1 class="mast">The News</h1><div class="strip"><span>No. —</span><span>Coming soon</span><span>—</span></div><div class="soon-paper"><div class="orn">${ORN}</div><span>No editions yet. Coming soon.</span><div class="orn">${ORN}</div></div></article>
  </div></div>`;
  const cur=issues.find(i=>i.id===N.reading)||issues[0];

    ${rPaper(cur)}
  </div></div>`;
}

/* ======================= WIKI ======================= */
const wikiSee=e=>!!e&&(S.role==='gm'||!e.gm);
function links(s){
  return esc(s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,t,lab)=>{const e=S.wiki.find(x=>esc(x.title).toLowerCase()===t.toLowerCase());lab=lab||t;return wikiSee(e)?`<a class="wl" data-a="wsel" data-v="${e.id}">${lab}</a>`:e?lab:`<span class="missing" title="No entry yet">${lab}</span>`});
}
/* a paragraph whose lines all start with "- " is a bulleted list */
function block(p,cls='b'){
  const ls=p.split('\n');
  if(ls.length&&ls.every(l=>l.startsWith('- ')))return `<ul class="bl">${ls.map(l=>`<li>${links(l.slice(2))}</li>`).join('')}</ul>`;
  if(cls&&p.length<60&&p.endsWith(':')&&!p.includes('\n'))return `<h3 class="wsub">${links(p.slice(0,-1))}</h3>`;
  return `<p class="${cls}">${links(p)}</p>`;
}
function wikiListHtml(){
  const q=S.wikiQ.trim().toLowerCase();
  const hit=e=>wikiSee(e)&&(!q||[e.title,e.summary,...e.body].join(' ').toLowerCase().includes(q));
  const cur=S.wiki.find(e=>e.id===S.wikiSel);
  const groups=WCATS.map(c=>[c,S.wiki.filter(e=>e.cat===c&&hit(e))]).filter(g=>g[1].length);
  return groups.length?groups.map(([c,es])=>`<details class="wcat" ${q||cur?.cat===c?'open':''}><summary>${esc(c)}<span class="n">${es.length}</span></summary><ul>${es.map(e=>`<li><button type="button" data-a="wsel" data-v="${e.id}" aria-current="${e.id===S.wikiSel}">${esc(e.title)}${e.gm?'<span class="tag">GM</span>':''}</button></li>`).join('')}</ul></details>`).join(''):'<p class="fine">No entries match.</p>';
}
/* the first plain paragraph opens with an illuminated initial, lapis or vermilion ground */
function ledeBody(e){return e.body.map((p,i)=>{const h=block(p);return i===0&&h.startsWith('<p class="b">')?h.replace('<p class="b">',`<p class="b lede${e.title.length%2?' alt':''}">`):h}).join('')}
function rArticle(e){
  const gm=S.role==='gm';
  if(!e||!wikiSee(e)) return '<p class="muted wpick">Pick an entry from the list.</p>';
  const needle='[['+e.title.toLowerCase()+']]';
  const backs=S.wiki.filter(x=>x.id!==e.id&&wikiSee(x)&&[x.summary,...x.body,...x.info.map(i=>i[1]),gm?x.secret||'':''].join(' ').toLowerCase().includes(needle));
  return `<div class="article">
    <div class="art-tools"><button type="button" class="btn sm ghost only-phone" data-a="wbrowse">${ICON.back}All entries</button>${gm?`<button type="button" class="btn sm" data-a="wedit" style="margin-left:auto">${ICON.pen}Edit</button>`:''}</div>
    <div class="eyebrow">${esc(e.cat)}${e.gm?' · GM only':''}</div>
    <h1>${esc(e.title)}</h1>
    <p class="wsum">${links(e.summary)}</p>
    <div class="orn">${ORN}</div>
    ${e.img?`<figure class="wfig"><img src="${esc(e.img.src)}" alt="${esc(e.img.alt)}" loading="lazy"><figcaption>${esc(e.img.cap)}</figcaption></figure>`:''}
    ${e.info.length?`<aside class="infobox"><table>${e.info.map(([k,v])=>`<tr><th scope="row">${esc(k)}</th><td>${links(v)}</td></tr>`).join('')}</table></aside>`:''}
    ${ledeBody(e)}
    ${e.soon?'<p class="soon">More coming soon</p>':''}
    ${gm&&e.secret?`<div class="secret"><div class="eyebrow">GM only · players never see this</div>${e.secret.split(/\n\s*\n/).map(p=>block(p,'')).join('')}</div>`:''}
    ${backs.length?`<div class="backs"><span class="eyebrow">Linked from</span> ${backs.map(b=>`<a class="wl" data-a="wsel" data-v="${b.id}">${esc(b.title)}</a>`).join(', ')}</div>`:''}
    ${e.src?`<p class="sample-note">From the lore notes: ${esc(e.src)}</p>`:''}
  </div>`;
}

  const fa=document.activeElement, fk=fa&&fa.dataset.a&&$('#shelf').contains(fa)?`#shelf [data-a="${fa.dataset.a}"][data-v="${fa.dataset.v||''}"]`:null;
  if(!canSee(S.ch))S.ch='table';

  const ms=$('#msgs'), msTop=same&&ms&&ms.scrollHeight-ms.scrollTop-ms.clientHeight>40?ms.scrollTop:null;
  $('#main').innerHTML=VIEWS[S.tab]();
  if(draft&&$('#msgIn'))$('#msgIn').value=draft;
  const v=$('#main .view');if(v&&keep)v.scrollTop=keep;

/* keyboard-aware layout: size the app to the visible viewport so the composer rides the keyboard */
(()=>{
  const vv=window.visualViewport, root=document.documentElement, app=()=>$('#app');
  let raf=0, base=window.innerHeight;
  const apply=()=>{raf=0;
    if(!vv)return;
    const h=Math.round(vv.height);
    root.style.setProperty('--vvh',h+'px');
    if(vv.offsetTop||window.scrollY)window.scrollTo(0,0);
    base=Math.max(base,window.innerHeight);
    const kb=base-h>120&&/^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement?.tagName||'');
    const a=app();if(a){const was=a.classList.contains('kb');a.classList.toggle('kb',kb);
      const m=$('#msgs');if(m&&(kb!==was))m.scrollTop=m.scrollHeight;}
  };
  const sched=()=>{if(!raf)raf=requestAnimationFrame(apply)};
  if(vv){vv.addEventListener('resize',sched);vv.addEventListener('scroll',sched)}
  window.addEventListener('orientationchange',()=>{base=0;setTimeout(()=>{base=window.innerHeight;sched()},300)});
  /* Safari's prev/next/done bar shows when other fields are focusable: park them while typing in chat */
  const park=on=>document.querySelectorAll('input,select,textarea,button').forEach(el=>{
    if(el.id==='msgIn'||el.closest('#composer')&&el.type==='submit')return;
    if(on){if(el.tabIndex!==-1&&!el.dataset.ti){el.dataset.ti='1';el.tabIndex=-1}}
    else if(el.dataset.ti){delete el.dataset.ti;el.removeAttribute('tabindex')}});
  document.addEventListener('focusin',e=>{if(e.target.id==='msgIn'){park(true);sched();setTimeout(sched,300)}});
  document.addEventListener('focusout',e=>{if(e.target.id==='msgIn'){park(false);setTimeout(sched,50)}});
})();

/* ======================= procedural art ======================= */
function mkNoise(seed){
  let s=(seed>>>0)||1;const rnd=()=>(s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296;
  const base=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[base[i],base[j]]=[base[j],base[i]]}
  const P=new Uint8Array(512);for(let i=0;i<512;i++)P[i]=base[i&255];
  const v=(x,y)=>P[P[x&255]+(y&255)]/255;
  const n=(x,y)=>{const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),w=fy*fy*(3-2*fy);
    const a=v(ix,iy),b=v(ix+1,iy),c=v(ix,iy+1),d=v(ix+1,iy+1);return a+(b-a)*u+(c-a)*w+(a-b-c+d)*u*w};
  n.fbm=(x,y,o=4)=>{let sum=0,amp=.5,f=1,tot=0;for(let i=0;i<o;i++){sum+=amp*n(x*f,y*f);tot+=amp;amp*=.5;f*=2.03}return sum/tot};
  n.rnd=rnd;return n;
}
function hash(a,b){let h=Math.imul(a|0,374761393)+Math.imul(b|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295}
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function paint(ctx,W,H,fn){const img=ctx.createImageData(W,H),d=img.data,o=[0,0,0];let i=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){fn(x,y,o);d[i++]=o[0];d[i++]=o[1];d[i++]=o[2];d[i++]=255}ctx.putImageData(img,0,0)}
function mixTo(o,a,b,t){t=t<0?0:t>1?1:t;o[0]=a[0]+(b[0]-a[0])*t;o[1]=a[1]+(b[1]-a[1])*t;o[2]=a[2]+(b[2]-a[2])*t}
const rgb=(a,al=1)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const shade=(a,f)=>[a[0]*f,a[1]*f,a[2]*f];
function blob(ctx,x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(.5,r),0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,Math.max(0,w),Math.max(0,h),r);else ctx.rect(x,y,w,h)}
function star(ctx,x,y,ro,ri,pts,rot){ctx.beginPath();for(let i=0;i<pts*2;i++){const r=i&1?ri:ro,a=rot+i*Math.PI/pts,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
function bgCanvas(type,cols,rows,c){const cv=mkCanvas(cols*c,rows*c),ctx=cv.getContext('2d');BG[type].draw(ctx,cv.width,cv.height,c,mkNoise(11+type.length*31+type.charCodeAt(0)));return cv}

function drawForest(ctx,W,H,c,n){
  const cy=x=>H*.5+Math.sin(x/W*Math.PI*1.7+.6)*H*.06, hw=c*1.2, g1=[48,76,38],g2=[104,130,62],d1=[112,88,58],d2=[156,130,88],tmp=[0,0,0];
  paint(ctx,W,H,(x,y,o)=>{
    mixTo(o,g1,g2,n.fbm(x/c*.32,y/c*.32,4)*1.5-.25);
    const dd=Math.abs(y-cy(x))+(n(x/c*.9+50,y/c*.9)-.5)*c*.7;
    if(dd<hw+c*.3){mixTo(tmp,d1,d2,n.fbm(x/c*.8+9,y/c*.8,3));const rut=Math.abs(Math.abs(y-cy(x))-hw*.42)<c*.07?.8:1,e=clamp((hw+c*.3-dd)/(c*.45),0,1);
      o[0]+=(tmp[0]*rut-o[0])*e;o[1]+=(tmp[1]*rut-o[1])*e;o[2]+=(tmp[2]*rut-o[2])*e}
    const s=(n(x*.6,y*.6)-.5)*18;o[0]+=s;o[1]+=s;o[2]+=s*.6;
  });
  const R=n.rnd,want=Math.round(W/c*H/c*.42),trees=[];
  for(let i=0;i<want*4&&trees.length<want;i++){const x=R()*W,y=R()*H;if(Math.abs(y-cy(x))<hw+c*.7)continue;trees.push([x,y,c*(.38+R()*.5)])}
  trees.sort((a,b)=>a[1]-b[1]);
  for(const [x,y,r] of trees)blob(ctx,x+r*.28,y+r*.34,r*1.04,'rgba(12,22,8,.38)');
  for(const [x,y,r] of trees){const b=[36+R()*26,70+R()*36,30+R()*16],g=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);g.addColorStop(0,rgb(shade(b,1.45)));g.addColorStop(1,rgb(shade(b,.62)));blob(ctx,x,y,r,g);
    for(let k=0;k<5;k++){const a=R()*6.283,d=r*.5*R();blob(ctx,x+Math.cos(a)*d-r*.12,y+Math.sin(a)*d-r*.12,r*(.2+R()*.18),rgb(shade(b,1.3),.5))}}
  for(let i=0;i<W/c*.5;i++){const x=R()*W,side=R()<.5?-1:1,y=cy(x)+side*(hw+c*.15),r=c*(.12+R()*.16);blob(ctx,x+r*.2,y+r*.25,r,'rgba(0,0,0,.3)');const g=ctx.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r);g.addColorStop(0,'#b9b4a8');g.addColorStop(1,'#6d6a62');blob(ctx,x,y,r,g)}
}
function drawTavern(ctx,W,H,c,n){
  const ph=c*.5,dark=[86,54,30],light=[156,108,62];
  paint(ctx,W,H,(x,y,o)=>{
    const i=Math.floor(y/ph),h=hash(i,7),off=h*c*5;
    mixTo(o,dark,light,h*.4+n.fbm(x/c*.22+i*7.3,y/ph*.5+i*3.1,3)*.75-.05);
    if(y-i*ph<1.3){o[0]*=.5;o[1]*=.5;o[2]*=.5}
    if((x+off)%(c*3.4)<1.3){o[0]*=.58;o[1]*=.58;o[2]*=.58}

  g.firstChild.innerHTML=`<div class="orn">${ORN}</div><h2 id="gateT">Norne</h2>${body}`;
}
const signInGate=(err='')=>gate(`<p>Sign in to join the table.</p><button type="button" class="btn primary" data-a="signIn">Sign in with Google</button>${err?`<p class="fine" role="alert">${esc(err)}</p>`:''}<p class="fine">New players wait until the GM lets them in.</p>`);
const outBtn='<button type="button" class="btn ghost" data-a="signOut">Sign out</button>';
function fail(err){
  console.error(err);
  const why=err?.code==='permission-denied'?'The campaign’s database refused the request. If you set Norne up, check that the security rules are published.':'Something went wrong while opening the campaign. Check your connection and reload the page.';
  if(started)return syncErr(why);
  gate(`<p>${esc(why)}</p>${outBtn}`);
}
let _se=0;
function syncErr(t){let el=$('#syncerr');if(!el){el=document.createElement('div');el.id='syncerr';el.className='syncerr';el.setAttribute('role','alert');document.body.append(el)}
  el.textContent=t;el.hidden=false;clearTimeout(_se);_se=setTimeout(()=>{el.hidden=true},6000)}
function meHtml(){
  if(!ME)return '';
  return `<div class="me"><span><b>${esc(ME.name)}</b> · ${isGM()?'GM':'Player'}</span><div class="row">${isGM()?`<button type="button" class="btn sm" data-a="members">${ICON.party}Players</button><button type="button" class="btn sm" data-a="lore">${ICON.upload}Import lore</button>`:''}<button type="button" class="btn sm" data-a="signOut">Sign out</button></div></div>`;
}

/* ---------- documents made of units ---------- */
const KNOWN=new Map(), LOADED=new Set();
const dref=path=>F.doc(db,...path.split('/'));
const noEl=(k,v)=>k==='imgEl'?undefined:v;
const track=pr=>pr.catch(err=>{console.error(err);syncErr(err?.code==='permission-denied'?'A change wasn’t saved: you don’t have permission for it.':'A change wasn’t saved. Check your connection.')});
/* write the units that differ from what the server last had; partial leaves other units alone */
function writeUnits(path,units,partial){
  if(!LOADED.has(path))return;
  const k=KNOWN.get(path), ch={};let n=0;
  for(const [key,v] of Object.entries(units)){const j=JSON.stringify(v,noEl);if(k.units[key]!==j){ch[key]=j;k.units[key]=j;n++}}
  if(!partial)for(const key of Object.keys(k.units))if(!(key in units)){ch[key]=F.deleteField();delete k.units[key];n++}
  if(n)track(F.setDoc(dref(path),ch,{merge:true}));
}
/* listen to a document; apply(units) runs only when it really changed */
function listenDoc(path,apply){
  return new Promise(res=>{
    F.onSnapshot(dref(path),snap=>{
      const units={};for(const [key,j] of Object.entries(snap.data()||{}))if(typeof j==='string')units[key]=j;
      const prev=KNOWN.get(path), same=prev&&Object.keys(prev.units).length===Object.keys(units).length&&Object.entries(units).every(([key,j])=>prev.units[key]===j);
      KNOWN.set(path,{units:{...units}});
      const first=!LOADED.has(path);LOADED.add(path);
      if(first||!same){apply(units);if(!first)changed()}
      res();
    },err=>{fail(err);res()});
  });
}
const vals=u=>Object.values(u).map(j=>JSON.parse(j));
const byO=(a,b)=>(a.o??0)-(b.o??0);
const asUnits=(arr,pub)=>Object.fromEntries(arr.map((x,i)=>[x.id,pub?pub(x,i):{...x,o:i}]).filter(e=>e[1]));

/* ---------- messages: one document each, tagged with who may read them ---------- */
const MKNOWN=new Map(), MDOCS=new Map();
const audOf=ch=>ch==='table'?['*']:ch==='gm'?['gm']:[ch.slice(3)];
function syncMsgs(){
  if(!LOADED.has('msgs'))return;
  for(const m of S.msgs){
    const j=JSON.stringify(m);if(MKNOWN.get(m.id)===j)continue;
    if(!isGM()&&m.ch==='gm')continue;
    MKNOWN.set(m.id,j);const {roll,...rest}=m;
    track(F.setDoc(dref('msgs/'+m.id),{...rest,aud:audOf(m.ch),roll:roll?JSON.stringify(roll):null},{merge:true}));
  }
}
function applyMsgDocs(){
  const local=new Map(S.msgs.map(m=>[m.id,m]));
  for(const [id,d] of MDOCS){
    const {aud,roll,...m}=d;if(roll)m.roll=JSON.parse(roll);
    const j=JSON.stringify(m), old=local.get(id);
    if(old&&JSON.stringify(old)===j)continue;
    local.set(id,m);MKNOWN.set(id,j);
  }
  S.msgs=[...local.values()].sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1));
}
function listenMsgs(){
  const qs=isGM()?[F.collection(db,'msgs')]:[F.query(F.collection(db,'msgs'),F.where('aud','array-contains','*')),F.query(F.collection(db,'msgs'),F.where('aud','array-contains',S.role))];
  let waiting=qs.length;
  return new Promise(res=>qs.forEach(q=>F.onSnapshot(q,snap=>{
    let any=false;
    snap.docChanges().forEach(c=>{any=true;if(c.type==='removed')MDOCS.delete(c.doc.id);else MDOCS.set(c.doc.id,c.doc.data())});
    if(any)applyMsgDocs();
    if(waiting>0&&--waiting===0){LOADED.add('msgs');res()}else if(any)changed();
  },err=>{fail(err);res()})));
}

/* ---------- maps kept in the database (hidden atlases and uploads) ---------- */
const MIMG=new Map(), MVIS=new Map();
function mapSrc(m){
  if(!m.src?.startsWith('fs:'))return Promise.resolve(m.src);
  const id=m.src.slice(3);
  if(!MIMG.has(id))MIMG.set(id,F.getDoc(dref('mapimgs/'+id)).then(s=>{const d=s.data()?.data;if(!d)throw new Error('no image');return d}).catch(e=>{MIMG.delete(id);throw e}));
  return MIMG.get(id);
}
/* a Firestore document holds at most 1 MB, so uploads are scaled down to fit */
function shrinkImage(img){
  let w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,2400/Math.max(w,h)),q=.85,out='';
  for(let i=0;i<12;i++){
    const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);
    if(out.length<900000)break;
    if(q>.6)q-=.1;else k*=.8;
  }
  return out;
}
function storeMapImage(id,data){MIMG.set(id,Promise.resolve(data));MVIS.set(id,false);track(F.setDoc(dref('mapimgs/'+id),{data,vis:false}))}

/* ---------- what each person writes ---------- */
function syncNow(){
  clearTimeout(_sq);if(!started)return;
  saveLocal();
  if(isGM()){
    writeUnits('game/chars',S.chars);
    const setup=S.combat.state==='setup';
    writeUnits('gm/combat',{c:setup?S.combat:null});
    writeUnits('game/combat',{c:setup?freshCombat(S.combat.bg):S.combat});
    if(LOADED.has('gm/maps')){
      for(const m of S.maps){if(!m.src?.startsWith('fs:'))continue;const id=m.src.slice(3),v=m.vis!==false;if(MVIS.get(id)!==v){MVIS.set(id,v);track(F.setDoc(dref('mapimgs/'+id),{vis:v},{merge:true}))}}
      writeUnits('gm/maps',asUnits(S.maps));
      writeUnits('game/maps',asUnits(S.maps,(m,i)=>m.vis===false?null:{...m,pins:m.pins.filter(p=>p.vis),o:i}));
    }
    if(LOADED.has('gm/wiki')){
      writeUnits('gm/wiki',asUnits(S.wiki));
      writeUnits('game/wiki',asUnits(S.wiki,(e,i)=>{if(e.gm)return null;const {secret,...pub}=e;return {...pub,o:i}}));
    }
    writeUnits('gm/npcs',asUnits(S.npcDb));
    writeUnits('gm/misc',{npcs:S.npcs,foes:FOES});
    writeUnits('game/news',Object.fromEntries(S.news.issues.map(i=>[i.id,i])));
  }else{
    const mine=ROLES[S.role]?.char;
    if(mine&&S.chars[mine])writeUnits('game/chars',{[mine]:S.chars[mine]},true);
    if(S.combat.state==='live')writeUnits('game/combat',{c:S.combat});
  }
  syncMsgs();
}
let _sq=0;
const queueSync=()=>{clearTimeout(_sq);_sq=setTimeout(syncNow,250)};

/* ---------- applying what arrives ---------- */
let GC=null,SC=null;
function setCombat(){S.combat=isGM()&&SC?.state==='setup'?SC:GC||freshCombat(S.combat.bg)}
function setMaps(u){
  const old=new Map(S.maps.map(m=>[m.id,m]));
  S.maps=vals(u).sort(byO);
  for(const m of S.maps){const o=old.get(m.id);if(o?.imgEl&&o.src===m.src)m.imgEl=o.imgEl}
}
/* a change from someone else redraws the page, but never under someone who is typing in a form */
let _rq=0,_late=false;
const typing=()=>{const a=document.activeElement;return !!a&&a.id!=='msgIn'&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#main').contains(a)};
function changed(){if(!live)return;clearTimeout(_rq);_rq=setTimeout(()=>{if(!$('#gate')&&typing()){_late=true;return}_late=false;if(readyCheck())render()},40)}
document.addEventListener('focusout',()=>{if(_late)setTimeout(()=>{if(_late&&!typing())changed()},0)});

function applyMembers(list){
  MEMBERS=list;
  for(const k of Object.keys(ROLES))if(k!=='gm')delete ROLES[k];
  const act=list.filter(m=>isSeat(m.role)).sort((a,b)=>a.role.slice(1)-b.role.slice(1));
  for(const m of act){const n=(m.name||'Player').trim()||'Player';ROLES[m.role]={person:n,char:'pc'+m.role.slice(1),long:n,short:n.split(/\s+/)[0]}}
  CHANNELS.splice(0,CHANNELS.length,{id:'table',who:['gm',...act.map(m=>m.role)]},...act.map(m=>({id:'dm-'+m.role,who:['gm',m.role]})),{id:'gm',who:['gm']});
  ensureChars();
  if($('#modal .mem'))$('#modal').innerHTML=membersHtml();
}
/* every seated player gets a blank Nörne character sheet */
function ensureChars(){
  if(!isGM()||!LOADED.has('game/chars'))return;
  let add=false;
  for(const r of seats()){const id=ROLES[r].char;if(!S.chars[id]){S.chars[id]=blankChar(id,r,TOK[(r.slice(1)-1)%TOK.length]);add=true}}
  if(add)queueSync();
}

/* ---------- this device: unread marks ---------- */
const LKEY=()=>'norne-seen-'+ME.uid;
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LKEY())||'{}');S.seenT[S.role]=d.t||{};S.news.seen[S.role]=new Set(d.n||[])}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY(),JSON.stringify({t:S.seenT[S.role],n:[...S.news.seen[S.role]]}))}catch(e){}}

/* ---------- start-up ---------- */
async function boot(){
  gate('<p class="fine">Opening the campaign book…</p>');
  try{F=await import('./vendor/firebase.js')}catch(e){gate('<p>Norne couldn’t load. Check your connection, then reload the page.</p>');return}
  const app=F.initializeApp(FB);auth=F.getAuth(app);db=F.initializeFirestore(app,{ignoreUndefinedProperties:true});
  if(EMU){F.connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});F.connectFirestoreEmulator(db,'127.0.0.1',8080);
    window.__emu={F,db};
    window.__emuSignIn=(email,name)=>F.signInWithCredential(auth,F.GoogleAuthProvider.credential(JSON.stringify({sub:email,email,name,email_verified:true})))}
  F.onAuthStateChanged(auth,u=>{if(started){location.reload();return}if(u)enter(u).catch(fail);else signInGate()});
}
async function enter(u){
  const email=(u.email||'').toLowerCase(), mref=dref('members/'+u.uid), gm=email===GM_EMAIL;
  gate('<p class="fine">Opening the campaign book…</p>');
  const snap=await F.getDoc(mref);
  if(!snap.exists())await F.setDoc(mref,{name:u.displayName||email.split('@')[0],email,role:gm?'gm':'pending',t:Date.now()});
  else if(gm&&snap.data().role!=='gm')await F.updateDoc(mref,{role:'gm'});
  F.onSnapshot(mref,s=>{
    const d=s.data();if(!d||s.metadata.hasPendingWrites)return;
    ME={uid:u.uid,email,name:d.name,role:d.role};
    if(started){if(d.role!==S.role)location.reload();else renderTop();return}
    if(d.role==='gm'||isSeat(d.role))start(d.role).catch(fail);
    else if(d.role==='removed')gate(`<p>You don’t have a seat at this table any more. Ask the GM if that’s a mistake.</p>${outBtn}`);
    else gate(`<p>Hi ${esc(d.name)}, you’re signed in.</p><p class="fine">The GM still needs to let you in. Ask them to open <b>Players</b> in their menu. This page opens by itself once they do.</p>${outBtn}`);
  },fail);
}
async function start(role){
  started=true;S.role=role;loadLocal();
  const docs=isGM()
    ?[['game/chars',null],['game/combat',null],['gm/combat',null],['gm/maps',null],['gm/wiki',null],['gm/npcs',null],['gm/misc',null],['game/news',null],['game/maps',null],['game/wiki',null]]
    :[['game/chars',null],['game/combat',null],['game/maps',null],['game/wiki',null],['game/news',null]];
  const APPLY={
    'game/chars':u=>{S.chars=Object.fromEntries(Object.entries(u).map(([k,j])=>[k,JSON.parse(j)]));ensureChars()},
    'game/combat':u=>{GC=u.c?JSON.parse(u.c):null;setCombat()},
    'gm/combat':u=>{SC=u.c?JSON.parse(u.c):null;setCombat()},
    'gm/maps':setMaps,
    'gm/wiki':u=>{S.wiki=vals(u).sort(byO)},
    'gm/npcs':u=>{S.npcDb=vals(u)},
    'gm/misc':u=>{S.npcs=u.npcs?JSON.parse(u.npcs):[];FOES.splice(0,FOES.length,...(u.foes?JSON.parse(u.foes):[]))},
    'game/news':u=>{S.news.issues=vals(u)},
    'game/maps':u=>{if(!isGM())setMaps(u)},
    'game/wiki':u=>{if(!isGM())S.wiki=vals(u).sort(byO)},
  };
  const members=new Promise(res=>F.onSnapshot(F.collection(db,'members'),snap=>{applyMembers(snap.docs.map(d=>({uid:d.id,...d.data()})));changed();res()},err=>{fail(err);res()}));
  await members;
  await Promise.all([...docs.map(([p])=>listenDoc(p,APPLY[p])),listenMsgs()]);
  ensureChars();
  for(const t of ['click','change','input','submit','keydown','pointerup'])document.addEventListener(t,queueSync);
  window.addEventListener('pagehide',syncNow);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)syncNow()});
  live=true;if(readyCheck())render();
  if(isGM()&&!S.wiki.length&&!S.maps.length)ACT.lore();
}
/* a new player waits for the GM's device to lay out their character sheet */
function readyCheck(){
  if(isGM()||S.chars[ROLES[S.role]?.char]){gate(null);return true}
  gate(`<p>You’re in. Your character sheet appears as soon as the GM has Norne open.</p>${outBtn}`);return false;
}

/* ---------- actions ---------- */
Object.assign(ACT,{
  signIn(){F.signInWithPopup(auth,new F.GoogleAuthProvider()).catch(e=>{if(!/popup-closed|cancelled-popup/.test(e?.code||''))signInGate(e?.code==='auth/popup-blocked'?'Your browser blocked the sign-in window. Allow pop-ups for this page and try again.':'Sign-in didn’t work. Try again.')})},
  signOut(){syncNow();F.signOut(auth).then(()=>location.reload())},
  members(){S.shelf=false;applyShelf();modal(membersHtml())},
  admit(a){const m=MEMBERS.find(x=>x.uid===a.dataset.v);if(!m)return;
    const used=[...MEMBERS.map(x=>+(x.seat||x.role).slice(1)||0),...Object.keys(S.chars).map(k=>+k.slice(2)||0)];
    const seat=m.seat||'p'+(Math.max(0,...used)+1);
    track(F.updateDoc(dref('members/'+m.uid),{role:seat,seat}));toast(`${m.name} is in.`)},
  kick(a){const m=MEMBERS.find(x=>x.uid===a.dataset.v);if(!m)return;
    track(F.updateDoc(dref('members/'+m.uid),{role:'removed'}));toast(isSeat(m.role)?`${m.name} no longer has a seat. Let them back in any time.`:`Turned ${m.name} away.`)},
  lore(){S.shelf=false;applyShelf();modal(`<h2>Import the lore</h2>
    <p class="muted">Choose <b>norne-gm-lore.json</b>. It fills the wiki and the maps, GM secrets included, and saves them for the whole table. Players only ever receive the parts they’re allowed to see.</p>
    <p class="fine">Entries and maps already in Norne with the same name are replaced by the file’s version. Anything you created yourself stays.</p>
    <div class="row end"><button type="button" class="btn ghost" data-a="close">Not now</button><label class="btn primary" for="loreUp">${ICON.upload}Choose the file</label><input type="file" id="loreUp" accept=".json,application/json" hidden data-c="loreUp"></div>`)},
});
function membersHtml(){
  const rank=m=>m.role==='pending'?0:isSeat(m.role)?1:2;
  const L=MEMBERS.filter(m=>m.role!=='gm').sort((a,b)=>rank(a)-rank(b)||(a.t||0)-(b.t||0));
  const st=m=>m.role==='pending'?'Waiting to be let in':m.role==='removed'?'Removed':`Seat ${m.role.slice(1)}`;
  return `<h2>Players</h2>
    <p class="muted">Anyone with the link can sign in with Google, but only people you let in can see the campaign. Each player gets a character sheet and a private chat with you.</p>
    <ul class="mem">${L.map(m=>`<li><div><b>${esc(m.name)}</b><br><span class="fine">${esc(m.email)} · ${st(m)}</span></div>
      ${isSeat(m.role)?`<input class="inp" data-c="memName" data-v="${m.uid}" value="${esc(m.name)}" aria-label="Name the table sees for ${esc(m.name)}"><button type="button" class="btn sm danger" data-a="kick" data-v="${m.uid}">Remove</button>`
        :`<button type="button" class="btn sm primary" data-a="admit" data-v="${m.uid}">Let in</button>${m.role==='pending'?`<button type="button" class="btn sm ghost" data-a="kick" data-v="${m.uid}">Turn away</button>`:''}`}</li>`).join('')
      ||'<li><div>No one else has signed in yet. Send your players the link to this page.</div></li>'}</ul>
    <div class="row end"><button type="button" class="btn ghost" data-a="close">Close</button></div>`;
}
Object.assign(CHANGE,{
  memName(t){const n=t.value.trim();if(n)track(F.updateDoc(dref('members/'+t.dataset.v),{name:n}))},
  loreUp(t){const f=t.files?.[0];if(!f)return;
    f.text().then(txt=>{const d=JSON.parse(txt);if(d.kind!=='norne-lore'||!Array.isArray(d.wiki)||!Array.isArray(d.maps))throw new Error('not lore');return importLore(d)})
      .catch(e=>{console.error(e);toast('That isn’t the Norne lore file.')})},
});
async function importLore(d){
  for(const e of d.wiki){const i=S.wiki.findIndex(x=>x.id===e.id);if(i>=0)S.wiki[i]=e;else S.wiki.push(e)}
  for(const m of d.maps){const i=S.maps.findIndex(x=>x.id===m.id);if(i>=0)S.maps[i]=m;else S.maps.push(m)}
  for(const [id,data] of Object.entries(d.mapimgs||{})){const v=S.maps.find(m=>m.src==='fs:'+id)?.vis!==false;MIMG.set(id,Promise.resolve(data));MVIS.set(id,v);await F.setDoc(dref('mapimgs/'+id),{data,vis:v})}
  closeModal();syncNow();render();toast(`Imported ${d.wiki.length} wiki entries and ${d.maps.length} maps.`);
}

boot();
})();
</script>
