<!doctype html>
<html lang="en">
<meta charset="utf-8">
<!-- maximum-scale=1 keeps iPhones from zooming in on a typing box and leaving the page zoomed (it then slides sideways); pinching still zooms.
     interactive-widget=resizes-content: Android Chrome shrinks the page above its keyboard instead of sliding the page up under it -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#060819">
<title>Norne</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Norne">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=IM+Fell+English:ital@0;1&family=Nunito+Sans:ital,opsz,wght@0,6..12,400..900;1,6..12,400..900&family=UnifrakturMaguntia&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Alegreya+SC:wght@400;500;700;800&family=IM+Fell+DW+Pica:ital@0;1&family=IM+Fell+English+SC&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/parchment.css">
<style>
/* The page is only a frame: the app fills the visible screen (js/app.js kbInit sizes it to the part above the phone keyboard). */
html,body{height:100%;margin:0;background:#060819;overflow:hidden;overscroll-behavior:none}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.device{container:dev / inline-size;position:fixed;inset:0 0 auto;height:100dvh;overflow:hidden}
.app{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.app.kb{--safe-b:0px}
body:has(.app[data-theme="day"]){background:#f1e9d0}
body:has(.app[data-style="parchment"]){background:#0e0906}
body:has(.app[data-style="parchment"][data-theme="day"]){background:#dcc79d}
noscript{position:fixed;inset:0;display:grid;place-items:center;padding:24px;color:#efecff;font:600 16px/1.5 system-ui,sans-serif;text-align:center}
</style>
<body>
<div class="device"><div class="app" id="app"></div></div>
<noscript>Norne needs JavaScript turned on.</noscript>
<script>
/* star tile shared by every screen */
(function(){
  const c = document.createElement('canvas'); c.width = c.height = 520; const x = c.getContext('2d');
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 210; i++) { const r = rnd() * 1.05 + .25; x.fillStyle = `rgba(${rnd()>.7?'214,204,255':'255,255,255'},${(rnd()*.6+.2).toFixed(2)})`; x.beginPath(); x.arc(rnd()*520, rnd()*520, r, 0, 7); x.fill(); }
  for (let i = 0; i < 4; i++) { const cx = rnd()*500+10, cy = rnd()*500+10, s = rnd()*3+3; x.fillStyle = 'rgba(255,214,140,.85)'; x.beginPath(); x.moveTo(cx, cy-s); x.quadraticCurveTo(cx, cy, cx+s, cy); x.quadraticCurveTo(cx, cy, cx, cy+s); x.quadraticCurveTo(cx, cy, cx-s, cy); x.quadraticCurveTo(cx, cy, cx, cy-s); x.fill(); }
  document.documentElement.style.setProperty('--stars', `url(${c.toDataURL()})`);
})();
</script>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/combat.js"></script>
<script src="js/fx.js"></script>
<script src="js/framer.js"></script>
<script src="js/sheets.js"></script>
<script src="js/app.js"></script>
<script src="js/sync.js"></script>
<script src="js/notify.js"></script>
<script>
(function(){
  const N = window.N, root = document.getElementById('app');
  let theme = 'night', style = 'storybook', fz = 'm'; try { theme = localStorage.getItem('norne-theme') || 'night'; style = localStorage.getItem('norne-style') || 'storybook'; fz = localStorage.getItem('norne-fz') || 'm'; } catch(e) {}
  const wide = matchMedia('(min-width: 760px)');
  const v = N.mount(root, {role:null, dev:wide.matches ? 'desktop' : 'phone', theme, style, fz});
  const onWide = () => { v.dev = wide.matches ? 'desktop' : 'phone'; N.render(v); };
  wide.addEventListener ? wide.addEventListener('change', onWide) : wide.addListener(onWide);
  N.kbInit();
  N.boot(v);
  /* sw.js makes every visit check for the newest scripts (see the note at its top) */
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
